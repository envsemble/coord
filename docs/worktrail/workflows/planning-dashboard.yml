name: Validate planning dashboard
on:
  push:
  pull_request:
jobs:
  dashboard:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: planning-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: planning-dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s planning-workflow/planning-bootstrap/scripts/tests -q
        working-directory: .
