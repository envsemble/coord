name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    name: Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # GitHub service containers run only on Linux runners, so the
      # PostgreSQL 17 capture fixture exists only on Linux. The disposable
      # fixture uses trust authentication and has no credentials.
      - name: Start the PostgreSQL 17 fixture
        if: runner.os == 'Linux'
        run: |
          docker run --detach --name atlas-postgres --publish 5432:5432 \
            --env POSTGRES_USER=atlas_fixture --env POSTGRES_DB=atlas_fixture \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd pg_isready --health-interval 2s --health-retries 60 \
            postgres:17
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' atlas-postgres)
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ]
          echo "ATLAS_TEST_POSTGRES=postgresql://atlas_fixture@127.0.0.1:5432/atlas_fixture" >> "$GITHUB_ENV"
      - name: Note the skipped PostgreSQL fixture
        if: runner.os != 'Linux'
        run: echo "::notice title=PostgreSQL fixture skipped::The PostgreSQL 17 capture test runs on Linux only; GitHub service containers are unavailable on ${{ runner.os }}."
      - run: npm ci
      - run: npm run format:check && npm run check:types
      # Workspace tests: diagrams, planning (reader and ported helpers), the atlas command and the app.
      - run: npm test
      - run: npm run build --workspace @atlas/app
      - run: npm run check && npm run check:package && npm run check:performance
      - run: npm run check:review
      - run: git diff --exit-code -- packages/diagrams/index.html packages/diagrams/downloads packages/diagrams/dist
      - run: npm run check:release
      - run: npm run review:example -- artifacts/review --git
      - run: npm run release:assemble -- artifacts/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-${{ matrix.os }}-${{ github.sha }}
          path: |
            artifacts/
            app/artifacts/
          if-no-files-found: error
          retention-days: 7
  skills:
    name: Skills (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Node skill tests (skills/tests/*.test.mjs); the skills need only Node and the atlas command.
      - run: npm run test:skills
  verify:
    name: CI
    needs: [node, skills]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to pass
        env:
          NODE: ${{ needs.node.result }}
          SKILLS: ${{ needs.skills.result }}
        run: test "$NODE" = success && test "$SKILLS" = success
  betterleaks:
    name: Betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Betterleaks
        env:
          BETTERLEAKS_VERSION: "1.8.1"
          BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
