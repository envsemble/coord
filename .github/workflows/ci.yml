name: CI
# One job for pull requests into dev and main once they are ready for review, on the Linux runner
# the envsemble organization variable CI_LINUX_RUNNER names. The end-to-end suite has its own
# workflow, for pull requests into main (e2e.yml), and releases have theirs (release.yml).
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  # @envsemble/envui comes from GitHub Packages, which needs a token even to install.
  packages: read
  # The first step lists the pull request's files.
  pull-requests: read
defaults:
  run:
    shell: bash
# A new push cancels the run for the pull request's older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A pull request that changes only documentation (Markdown files and docs/) runs only this
      # step and Betterleaks. Markdown the product ships or tests (the plugin's skills and
      # the end-to-end fixtures) is not documentation. If listing the files fails, the checks run.
      - name: List the changed files
        id: changes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          PRODUCT: ^(plugin|app/e2e/fixtures)/
        run: |
          # A renamed file counts by its old path too.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files?per_page=100" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -qvE '(\.md$|^docs/)' <<<"$files" || grep -qE "$PRODUCT" <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
            echo "::notice title=Documentation only::The checks are skipped; Betterleaks still runs."
          fi
      - uses: actions/setup-node@v4
        if: ${{ steps.changes.outputs.code != 'false' }}
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@envsemble"
      - uses: actions/setup-java@v4
        if: ${{ steps.changes.outputs.code != 'false' }}
        with:
          distribution: temurin
          java-version: "21"
      # The disposable PostgreSQL 17 capture fixture uses trust authentication and has no credentials.
      - name: Start the PostgreSQL 17 fixture
        if: ${{ steps.changes.outputs.code != 'false' }}
        run: |
          docker run --detach --name atlas-postgres --publish 5432:5432 \
            --env POSTGRES_USER=atlas_fixture --env POSTGRES_DB=atlas_fixture \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd pg_isready --health-interval 2s --health-retries 60 \
            postgres:17
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' atlas-postgres)
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ]
          echo "ATLAS_TEST_POSTGRES=postgresql://atlas_fixture@127.0.0.1:5432/atlas_fixture" >> "$GITHUB_ENV"
      - run: npm ci
        if: ${{ steps.changes.outputs.code != 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check && npm run lint && npm run check:types
        if: ${{ steps.changes.outputs.code != 'false' }}
      # Workspace tests: diagrams, planning (reader and ported helpers), the atlas command and the app.
      - run: npm test
        if: ${{ steps.changes.outputs.code != 'false' }}
      # The plugin packaging test (plugin/tests/*.test.mjs): its skills, manifests and hooks.
      - run: npm run test:skills
        if: ${{ steps.changes.outputs.code != 'false' }}
      - run: npm run build --workspace @envsemble/atlas-app
        if: ${{ steps.changes.outputs.code != 'false' }}
      - run: npm run check && npm run check:package && npm run check:performance
        if: ${{ steps.changes.outputs.code != 'false' }}
      - run: git diff --exit-code -- packages/diagrams/index.html packages/diagrams/downloads packages/diagrams/dist
        if: ${{ steps.changes.outputs.code != 'false' }}
      # The release assembles reproducibly; nothing is kept from it.
      - run: npm run check:release
        if: ${{ steps.changes.outputs.code != 'false' }}
      # Also after a failed check, so one run reports both.
      - name: Scan the history with Betterleaks
        if: ${{ !cancelled() }}
        env:
          BETTERLEAKS_VERSION: "1.8.1"
          BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
