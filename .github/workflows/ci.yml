name: Verify and assemble Atlas
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas_fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: atlas_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_TEST_POSTGRES: postgresql://atlas_fixture:fixture_only@127.0.0.1:5432/atlas_fixture
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run format:check && npm run check:types
      - run: npm test
      - run: npm run check && npm run check:package && npm run check:performance
      - run: git diff --exit-code -- index.html downloads dist
      - run: npm run check:release
      - run: npm run review:example -- artifacts/review --git
      - run: npm run release:assemble -- artifacts/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
