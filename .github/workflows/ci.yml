name: CI
# Runs on pull requests into dev and main once they are ready for review, on Linux only. Every job
# runs on the runner the envsemble organization variable CI_RUNNER names.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  # @envsemble/envui comes from GitHub Packages, which needs a token even to install.
  packages: read
  # The changes job lists the pull request's files.
  pull-requests: read
defaults:
  run:
    shell: bash
# A new push cancels the run for the pull request's older head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      # A pull request that changes only documentation (Markdown files and docs/) skips the checks
      # below. They then report skipped, which a required check accepts. Markdown the product ships
      # or tests (the plugin's skills, extras and the end-to-end fixtures) is not documentation.
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          PRODUCT: ^(plugin|extras|app/e2e/fixtures)/
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --jq '.[].filename')
          if grep -vE '(\.md$|^docs/)' <<<"$files" | grep -q . || grep -qE "$PRODUCT" <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
  node:
    name: Node
    needs: changes
    # Runs unless the changes job found documentation only, also when it failed.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@envsemble"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The disposable PostgreSQL 17 capture fixture uses trust authentication and has no credentials.
      - name: Start the PostgreSQL 17 fixture
        run: |
          docker run --detach --name atlas-postgres --publish 5432:5432 \
            --env POSTGRES_USER=atlas_fixture --env POSTGRES_DB=atlas_fixture \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd pg_isready --health-interval 2s --health-retries 60 \
            postgres:17
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' atlas-postgres)
            [ "$status" = healthy ] && break
            sleep 2
          done
          [ "$status" = healthy ]
          echo "ATLAS_TEST_POSTGRES=postgresql://atlas_fixture@127.0.0.1:5432/atlas_fixture" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check && npm run check:types
      # Workspace tests: diagrams, planning (reader and ported helpers), the atlas command and the app.
      - run: npm test
      - run: npm run build --workspace @envsemble/atlas-app
      - run: npm run check && npm run check:package && npm run check:performance
      # The plan export viewer bundles the diagram viewer built above, so it is rebuilt after it.
      - run: npm run build --workspace @envsemble/atlas-planning
      - run: git diff --exit-code -- packages/diagrams/index.html packages/diagrams/downloads packages/diagrams/dist packages/planning/dist
      - run: npm run check:release
      - run: npm run release:assemble -- artifacts/release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-${{ github.sha }}
          path: |
            artifacts/
            app/artifacts/
          if-no-files-found: error
          retention-days: 7
  skills:
    name: Skills
    needs: changes
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@envsemble"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The plugin packaging test (plugin/tests/*.test.mjs): its skills, manifests and hooks need only Node.
      - run: npm run test:skills
  e2e:
    name: End-to-end
    needs: changes
    # Only for releases: pull requests into main.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' && github.base_ref == 'main' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@envsemble"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which Chromium's
      # sandbox needs. Allow them (see the app README) rather than running without the sandbox.
      - name: Allow the Chromium sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update && sudo apt-get install --yes xvfb
      # The AppImage, in app/release.
      - run: npm run package --workspace @envsemble/atlas-app
      - name: End-to-end tests against the packaged app
        run: xvfb-run --auto-servernum npm run test:e2e --workspace @envsemble/atlas-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-desktop-${{ github.sha }}
          path: |
            app/release/*.AppImage
            app/playwright-report/
            app/test-results/
          if-no-files-found: warn
          retention-days: 7
  verify:
    name: CI
    needs: [changes, node, skills, e2e]
    # Skipped, and so passing, for drafts and for documentation only.
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.code != 'false' }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to pass
        env:
          NODE: ${{ needs.node.result }}
          SKILLS: ${{ needs.skills.result }}
          E2E: ${{ needs.e2e.result }}
          BASE: ${{ github.base_ref }}
        run: |
          test "$NODE" = success && test "$SKILLS" = success
          # The end-to-end suite runs only for pull requests into main.
          test "$E2E" = success || { test "$E2E" = skipped && test "$BASE" = dev; }
  betterleaks:
    name: Betterleaks
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Betterleaks
        env:
          BETTERLEAKS_VERSION: "1.8.1"
          BETTERLEAKS_SHA256: "efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a"
        run: |
          archive="$RUNNER_TEMP/betterleaks.tar.gz"
          curl -fsSL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/betterleaks" git . --redact
