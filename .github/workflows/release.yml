name: Release
# Pushing a version tag (v0.7.2) on main makes the GitHub Release: the release ZIP and the AppImage
# from the Linux runner (CI_LINUX_RUNNER), the Windows installer, tested by installing it, from the
# Windows runner (CI_WINDOWS_RUNNER). The files go straight into a draft release, so nothing uses
# artifact storage; the draft is published only when both builds pass and is deleted otherwise.
on:
  push:
    tags: ["v*"]
permissions:
  # Creates, fills and publishes the release.
  contents: write
  # @envsemble/envui comes from GitHub Packages, which needs a token even to install.
  packages: read
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
jobs:
  draft:
    name: Draft the release
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only a commit on main, tagged with the version in package.json, with notes in CHANGELOG.md.
      - name: Check the tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main."; exit 1; }
          version=$(sed -n 's/^  "version": "\(.*\)",\{0,1\}$/\1/p' package.json | head -n 1)
          [ "$TAG" = "v$version" ] ||
            { echo "::error::$TAG does not match the version in package.json ($version)."; exit 1; }
          awk -v heading="## $version " 'index($0, heading) == 1 { keep = 1; next } /^## / { keep = 0 } keep' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" ||
            { echo "::error::CHANGELOG.md has no section for $version."; exit 1; }
      - name: Create the draft
        run: |
          # A draft left by an earlier attempt at this tag is replaced; a published release is not.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "::error::$TAG is already released."; exit 1; }
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --verify-tag --title "Atlas $TAG" --notes-file "$RUNNER_TEMP/notes.md"
  linux:
    name: Release ZIP and AppImage
    needs: draft
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@envsemble"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check:release
      - run: npm run release:assemble -- artifacts/release
      - run: npm run package --workspace @envsemble/atlas-app
      - name: Add them to the draft
        run: gh release upload "$TAG" artifacts/release/*.zip app/release/*.AppImage
  windows:
    name: Windows installer
    needs: draft
    runs-on: ${{ vars.CI_WINDOWS_RUNNER }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@envsemble"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The unsigned NSIS installer, in app/release.
      - run: npm run package --workspace @envsemble/atlas-app
      # Installs Atlas for the runner's user, starts it and uninstalls it.
      - name: Test the installer
        env:
          ATLAS_E2E_INSTALLER: "1"
        run: npm run test:e2e --workspace @envsemble/atlas-app -- --grep=Windows.installer
      - name: Add it to the draft
        run: gh release upload "$TAG" app/release/Atlas-Setup-*.exe
      # Only a failure keeps anything: its report, for the organization's artifact retention. A
      # refused upload never fails the job.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: installer-failure-${{ github.sha }}
          path: |
            app/playwright-report/
            app/test-results/
          if-no-files-found: ignore
  publish:
    name: Publish the release
    needs: [draft, linux, windows]
    # Also after a failed build, to delete the draft.
    if: ${{ !cancelled() && needs.draft.result == 'success' }}
    runs-on: ${{ vars.CI_LINUX_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Publish, or delete the draft
        env:
          GH_REPO: ${{ github.repository }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          if [ "$LINUX" = success ] && [ "$WINDOWS" = success ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release delete "$TAG" --yes
            echo "::error::No release: the Linux build ended $LINUX, the Windows build $WINDOWS."
            exit 1
          fi
