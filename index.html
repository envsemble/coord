<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>R5 · OntoUML</title>
    <style>
      :root {
  color-scheme: dark;
  --canvas: #10151f;
  --surface: #18202d;
  --text: #e0e7f3;
  --muted: #9caac0;
  --border: #303d52;
  --hover: #243247;
  --focus: #a8bfff;
  --selected-bg: #263f66;
  --selected-text: #c1d8ff;
  --link: #92b8ff;
  --grid: #29364c;
  --accent: #9dbbff;
  --shadow: #00000040;
}
:root[data-theme="light"] {
  color-scheme: light;
  --canvas: #fafbfe;
  --surface: #ffffff;
  --text: #26354c;
  --muted: #627088;
  --border: #e2e7ef;
  --hover: #edf0f6;
  --focus: #5876db;
  --selected-bg: #e7edfc;
  --selected-text: #3655a3;
  --link: #496baf;
  --grid: #d9e0eb;
  --accent: #486bd0;
  --shadow: #24344c15;
}

:root {
  font-family:
    Inter,
    Segoe UI,
    Arial,
    sans-serif;
  color: var(--text);
  background: var(--canvas);
  font-size: 13px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  overflow: hidden;
}
button,
input,
a {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 6px;
  height: 32px;
  padding: 0 11px;
  white-space: nowrap;
}
button:hover {
  background: var(--hover);
}
button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
button[aria-pressed="true"],
button[aria-selected="true"] {
  background: var(--selected-bg);
  color: var(--selected-text);
}
header {
  position: relative;
  z-index: 10;
  height: 50px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand {
  font-weight: 650;
  letter-spacing: 0.03em;
  color: var(--muted);
  margin-right: 3px;
}
.tabs {
  display: flex;
  gap: 3px;
}
.spacer {
  flex: 1;
}
.search {
  position: relative;
  width: 190px;
}
.search input {
  width: 100%;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--canvas);
  padding: 0 10px;
  color: inherit;
}
.suggestions {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  top: 36px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 7px 25px var(--shadow);
  border-radius: 8px;
  max-height: 280px;
  overflow: auto;
}
.suggestions.open {
  display: block;
}
.suggestions button {
  display: block;
  text-align: left;
  width: 100%;
  padding: 0 8px;
  font-size: 12px;
}
.camera-controls {
  display: flex;
  align-items: center;
  gap: 2px;
  border-left: 1px solid var(--border);
  padding-left: 8px;
}
.icon {
  padding: 0;
  width: 30px;
  font-size: 18px;
}
.zoom-readout {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  min-width: 50px;
  padding: 0 6px;
}
.fields {
  font-size: 12px;
}
.divider {
  height: 20px;
  width: 1px;
  background: var(--border);
}
.menu-wrap {
  position: relative;
}
.menu {
  display: none;
  position: absolute;
  right: 0;
  top: 38px;
  min-width: 190px;
  padding: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 7px 25px var(--shadow);
}
.menu.open {
  display: block;
}
.menu a {
  display: block;
  padding: 9px 10px;
  border-radius: 4px;
  text-decoration: none;
  color: var(--link);
}
.menu a:hover {
  background: var(--hover);
}
.panel {
  display: none;
  position: fixed;
  z-index: 9;
  right: 14px;
  top: 64px;
  width: 310px;
  max-height: calc(100vh - 80px);
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  box-shadow: 0 8px 32px var(--shadow);
  padding: 18px;
  user-select: text;
}
.panel.open {
  display: block;
}
.panel-close {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 20px;
}
.panel h1 {
  font-size: 17px;
  line-height: 1.3;
  margin: 9px 20px 14px 0;
  overflow-wrap: anywhere;
}
.tag {
  font-size: 11px;
  color: var(--muted);
}
.panel p {
  font-size: 12px;
  line-height: 1.65;
  margin: 10px 0;
}
.panel h2 {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 22px 0 9px;
}
.panel a {
  color: var(--link);
  text-decoration: none;
}
.panel a:hover {
  text-decoration: underline;
}
.source {
  display: block;
  font-size: 12px;
  margin: 10px 0;
  line-height: 1.5;
}
.field-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
}
.field-row span:last-child {
  color: var(--muted);
  text-align: right;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 9px 0;
  font-size: 12px;
}
.swatch {
  width: 15px;
  height: 15px;
  border: 1px solid var(--diagram-border);
  border-radius: 3px;
}
.panel kbd {
  font: 11px inherit;
  background: var(--hover);
  padding: 2px 5px;
  border-radius: 3px;
}
.muted {
  color: var(--muted);
}
@media (max-width: 900px) {
  header {
    gap: 6px;
    padding: 0 8px;
  }
  .brand {
    display: none;
  }
  .search {
    width: 150px;
  }
  .camera-controls {
    padding-left: 4px;
  }
  .fields {
    padding: 0 7px;
  }
}
@media (max-width: 680px) {
  .search {
    display: none;
  }
  .tabs button {
    font-size: 12px;
    padding: 0 8px;
  }
  .zoom-readout {
    min-width: 43px;
  }
  .camera-controls {
    gap: 0;
  }
  .panel {
    right: 8px;
    width: min(310px, calc(100vw - 16px));
  }
  header {
    gap: 4px;
  }
}
#search-toggle {
  display: none;
}
@media (max-width: 680px) {
  #search-toggle {
    display: block;
  }
  .search {
    position: absolute;
    right: 160px;
    top: 58px;
    width: 230px;
    background: var(--surface);
    padding: 7px;
    border-radius: 8px;
    box-shadow: 0 7px 25px var(--shadow);
  }
  .search.open {
    display: block;
  }
  .search .suggestions {
    top: 42px;
  }
}

input::placeholder {
  color: var(--muted);
}

.relation-end {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.relation-end button {
  padding: 0;
  color: var(--link);
  text-align: left;
  height: auto;
  min-height: 28px;
  overflow-wrap: anywhere;
  white-space: normal;
}
.count-badge {
  flex: none;
  padding: 3px 8px;
  border: 1px solid var(--diagram-border);
  border-radius: 5px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  color: var(--text);
}

:root {
  --diagram-border: #657b99;
  --diagram-divider: #46566e;
  --diagram-edge: #8395b0;
  --diagram-inheritance: #a2b4cf;
  --diagram-label: #bdcade;
  --diagram-muted: #9faec5;
  --diagram-attribute: #c8d4e7;
  --node-kind: #1b304b;
  --node-role: #423623;
  --node-relator: #342943;
  --node-phase: #203c31;
  --node-event: #432b2d;
  --node-mode: #203842;
}
:root[data-theme="light"] {
  --diagram-border: #72839d;
  --diagram-divider: #b7c2d2;
  --diagram-edge: #77859a;
  --diagram-inheritance: #57667e;
  --diagram-label: #42516a;
  --diagram-muted: #5b687f;
  --diagram-attribute: #44546c;
  --node-kind: #edf4ff;
  --node-role: #fff3da;
  --node-relator: #f3eaff;
  --node-phase: #eaf8f0;
  --node-event: #fff0ed;
  --node-mode: #eaf7fa;
}
#canvas {
  position: fixed;
  inset: 50px 0 0;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  cursor: grab;
  background-color: var(--canvas);
  background-image: radial-gradient(var(--grid) 0.7px, transparent 0.7px);
  background-size: 20px 20px;
  user-select: none;
}
#canvas.dragging {
  cursor: grabbing;
}
#world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#world svg {
  display: block;
  overflow: visible;
}
.node {
  cursor: pointer;
  outline: none;
}
.node:hover .node-box,
.node:focus-visible .node-box {
  stroke: var(--accent);
  stroke-width: 2;
}
.node.selected .node-box {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.diagram-element {
  transition: opacity 130ms ease;
}
.node.dimmed,
.edge.dimmed {
  opacity: 0.16;
}
.node.highlighted .node-box {
  stroke: var(--accent);
  stroke-width: 2;
}
.node.highlighted.selected .node-box {
  stroke-width: 2.5;
}
.edge {
  outline: none;
  cursor: pointer;
}
.edge.highlighted .edge-path,
.edge:focus-visible .edge-path {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.edge.highlighted .multiplicity rect {
  stroke: var(--accent);
  stroke-width: 1.4;
}
.edge.highlighted .edge-label text {
  fill: var(--accent);
}
.edge-label {
  pointer-events: all;
}
@media (prefers-reduced-motion: reduce) {
  .diagram-element {
    transition: none;
  }
}

    </style>

      const MODEL={"title":"R5Reloaded / Apex Season 3","version":"0.2","date":"2026-10-06","targetBuild":"R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM","status":"Public-source static inspection; native engine internals partially opaque","repositories":[{"repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf"},{"repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578"}],"classes":[{"name":"GameServer","stereo":"kind","pkg":"shared","description":"An identified engine-side server resource, distinct from its hosting process and gameplay occurrences.","evidence":["R1"],"attrs":[["runtimeIdentity","Text"],["serverState","Text"],["tickCount","Integer"],["tickInterval","Decimal"],["maxClients","Integer"],["isDedicated","Boolean"]],"id":"class-GameServer"},{"name":"GameSession","stereo":"kind","pkg":"shared","description":"A conceptual identity for the current level and game roster. No literal match ID was recovered; the boundary is a modeling hypothesis.","evidence":["R1","R11"],"attrs":[["sessionIdentity","Text"],["spawnCount","Integer"],["gameState","Text"]],"id":"class-GameSession"},{"name":"PlaylistConfig","stereo":"kind","pkg":"shared","description":"A mode configuration artifact used by server and gameplay scripts; the exact file and override lifecycle is not reconstructed.","evidence":["R8","R15"],"attrs":[["playlistName","Text"]],"id":"class-PlaylistConfig"},{"name":"PlatformIdentity","stereo":"kind","pkg":"shared","description":"An identity distinguished by a platform/persona UID. Slot-local user IDs do not supply this identity. Real identities and placeholder bot IDs must be distinguished.","evidence":["R2","R13"],"attrs":[["platformUid","Text"]],"id":"class-PlatformIdentity"},{"name":"ClientApplication","stereo":"kind","pkg":"shared","description":"The remote game application as a runtime resource. Its process structure is abstracted rather than equated with CClient.","evidence":["R0","R9"],"attrs":[],"id":"class-ClientApplication"},{"name":"DirectoryService","stereo":"kind","pkg":"backend","description":"The opaque Pylon service endpoint reached by the SDK API client. Its internal objects, storage, and deployment are unresolved.","evidence":["R9"],"attrs":[["endpointIdentity","Text"]],"id":"class-DirectoryService"},{"name":"ServerListing","stereo":"kind","pkg":"backend","description":"An identified advertisement information artifact describing a game server. It is separate from the server it describes.","evidence":["R8"],"attrs":[["name","Text"],["hidden","Boolean"],["mapName","Text"],["playlistName","Text"],["address","Text"],["port","Integer"],["numPlayers","Integer"],["maxPlayers","Integer"],["versionId","Text"]],"id":"class-ServerListing"},{"name":"PublishedListing","stereo":"role","pkg":"backend","description":"A listing currently published through the directory service. Publication identity and lifecycle are conceptual abstractions.","evidence":["R9"],"attrs":[],"id":"class-PublishedListing"},{"name":"ListingPublication","stereo":"relator","pkg":"backend","description":"The time-bounded publication relationship between a directory service and an advertised listing.","evidence":["R9"],"attrs":[],"id":"class-ListingPublication"},{"name":"HiddenListing","stereo":"phase","pkg":"backend","description":"A listing whose intrinsic hidden field is true; retrieval can use a token. Offline hosting is the absence of a publication, not a listing phase.","evidence":["R8","R9"],"attrs":[],"id":"class-HiddenListing"},{"name":"PublicListing","stereo":"phase","pkg":"backend","description":"A listing whose intrinsic hidden field is false.","evidence":["R8","R9"],"attrs":[],"id":"class-PublicListing"},{"name":"ListingUpdate","stereo":"event","pkg":"backend","description":"An occurrence submitting host-listing data through PostServerHost; it may create or refresh an advertisement.","evidence":["R9"],"attrs":[],"id":"class-ListingUpdate"},{"name":"ServerLookup","stereo":"event","pkg":"backend","description":"An occurrence querying a server list or looking up a listing by token. It does not itself establish a game connection.","evidence":["R9"],"attrs":[["lookupMethod","Text"]],"id":"class-ServerLookup"},{"name":"ClientSlot","stereo":"kind","pkg":"runtime","description":"A server-owned CClient resource/slot, reused across connection lifecycles. Neither the remote application nor an enduring player identity.","evidence":["R1","R2"],"attrs":[["slotIndex","Integer"],["currentUserId","Integer","0..1"],["signonStage","Text"],["fakeClient","Boolean"],["persistenceState","Text"]],"id":"class-ClientSlot"},{"name":"SessionParticipant","stereo":"role","pkg":"runtime","description":"A client slot currently admitted to a game session. Continuity across reconnect or slot reuse is not presumed.","evidence":["R1","R2"],"attrs":[],"id":"class-SessionParticipant"},{"name":"SessionParticipation","stereo":"relator","pkg":"runtime","description":"The current relationship between an admitted slot and one session. Historical player results require separate records.","evidence":["R1","R2"],"attrs":[],"id":"class-SessionParticipation"},{"name":"ActiveClientSlot","stereo":"phase","pkg":"runtime","description":"A slot with sign-on state FULL, matching CClient::IsActive; this is distinct from avatar life state.","evidence":["R2"],"attrs":[],"id":"class-ActiveClientSlot"},{"name":"NetworkChannel","stereo":"kind","pkg":"runtime","description":"A CNetChan communication resource with endpoint and sequencing state. It can exist before a player entity is active.","evidence":["R3"],"attrs":[["remoteEndpoint","Text"],["outSequence","Integer"],["inSequence","Integer"],["acknowledgedSequence","Integer"]],"id":"class-NetworkChannel"},{"name":"ClientReplicationState","stereo":"mode","pkg":"runtime","description":"Slot-specific replication/command state, modeled as an intrinsic mode rather than another player identity.","evidence":["R2"],"attrs":[["commandTick","Integer"],["deltaTick","Integer"],["snapshotTick","Integer"]],"id":"class-ClientReplicationState"},{"name":"PlayerEntity","stereo":"kind","pkg":"runtime","description":"An identified player character entity. Script-level respawn can reuse its reference; native allocation and lifetime details remain unresolved.","evidence":["R5","R14"],"attrs":[["entityHandle","Integer"],["teamNumber","Integer"],["alive","Boolean"],["bleedoutState","Text"]],"id":"class-PlayerEntity"},{"name":"AssignedPlayerEntity","stereo":"role","pkg":"runtime","description":"A player entity assigned to a session participant; this role also permits fake-client participants.","evidence":["R1","R2","R5"],"attrs":[],"id":"class-AssignedPlayerEntity"},{"name":"AvatarAssignment","stereo":"relator","pkg":"runtime","description":"The control relationship between one session participant and one assigned player entity. Exact allocation lifecycle is a hypothesis.","evidence":["R2","R5"],"attrs":[],"id":"class-AvatarAssignment"},{"name":"MatchSquad","stereo":"kind","pkg":"runtime","description":"A session-scoped team/roster abstraction grounded in team numbers and team-based script operations.","evidence":["R2","R15"],"attrs":[["teamNumber","Integer"]],"id":"class-MatchSquad"},{"name":"ReadyPlayer","stereo":"phase","pkg":"runtime","description":"A living player entity not in bleedout, using intrinsic life and bleedout state. This does not assert combat eligibility under every temporary effect.","evidence":["R12"],"attrs":[],"id":"class-ReadyPlayer"},{"name":"DownedPlayer","stereo":"phase","pkg":"runtime","description":"A living player entity in bleedout. Alive and downed are not mutually exclusive raw engine predicates.","evidence":["R12"],"attrs":[],"id":"class-DownedPlayer"},{"name":"EliminatedIdentity","stereo":"role","pkg":"runtime","description":"A platform identity with a current elimination status in this session. Source evidence is keyed by UID rather than entity life state.","evidence":["R13"],"attrs":[],"id":"class-EliminatedIdentity"},{"name":"EliminationStatus","stereo":"relator","pkg":"runtime","description":"The session-specific elimination relationship of a platform identity. The source implements its registry as information records.","evidence":["R13"],"attrs":[],"id":"class-EliminationStatus"},{"name":"GameMatch","stereo":"event","pkg":"runtime","description":"The gameplay occurrence associated with a conceptual game session; not a literal SDK class.","evidence":["R11","R15"],"attrs":[],"id":"class-GameMatch"},{"name":"ServerFrame","stereo":"event","pkg":"runtime","description":"One invocation of the visible server-frame entry point. Full simulation semantics are delegated to the binary.","evidence":["R10"],"attrs":[],"id":"class-ServerFrame"},{"name":"InputCommand","stereo":"kind","pkg":"runtime","description":"An action-request information artifact represented by CUserCmd. Receiving it does not imply that it was processed.","evidence":["R4"],"attrs":[["commandNumber","Integer"],["tickCount","Integer"],["commandTime","Decimal"],["frameTime","Decimal"],["viewAngles","Vector3"],["buttons","Integer"]],"id":"class-InputCommand"},{"name":"CommandProcessing","stereo":"event","pkg":"runtime","description":"An accepted movement-command execution passed to the native processor. Attempts rejected by the wrapper are distinct.","evidence":["R5"],"attrs":[],"id":"class-CommandProcessing"},{"name":"Snapshot","stereo":"kind","pkg":"runtime","description":"A partially understood server-state information artifact; recovered CFrameSnapshot layout does not establish a complete world-state semantics.","evidence":["R6"],"attrs":[],"id":"class-Snapshot"},{"name":"SnapshotEmission","stereo":"event","pkg":"runtime","description":"An invocation of the snapshot-send interface for one client slot. The actual encoding and emission body is not available here.","evidence":["R7"],"attrs":[],"id":"class-SnapshotEmission"},{"name":"Respawn","stereo":"event","pkg":"runtime","description":"An occurrence restorin esource, distinct from the remote application. A command can be declined by the movement wrapper. Downed players can satisfy the alive predicate. Elimination is recorded by platform UID and cleared by the inspected respawn path.\n\nSOURCE LINKS\nR0 — Supported Apex Season 3 build\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/README.md#L42\nThe SDK targets R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM and requires existing game executables.\n\nR1 — CServer declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/server/server.h#L30\nExposes server state, tick count and interval, client storage, capacity, map, and dedicated-server status.\n\nR2 — CClient declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/client/client.h#L64\nServer-side client records distinguish user ID, Nucleus identity, channel, sign-on stage, fake-client flag, and replication ticks.\n\nR3 — Network channel declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/net_chan.h#L28\nExposes endpoint, sequence and acknowledgement state, message handling, and reliable/unreliable streams.\n\nR4 — Input command declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/game/shared/usercmd.h#L29\nExposes sequence, tick, command time, movement, buttons, view angles, and frame time; unknown fields remain.\n\nR5 — Command-processing wrapper\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/game/server/player_command.cpp#L25\nThe SDK can decline command processing based on a movement-time budget, then delegates accepted processing to the binary.\n\nR6 — Partial snapshot declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/framesnapshot.h#L5\nA partial recovered layout includes tick-update data and entity-oriented buffers. Most fields remain unidentified.\n\nR7 — Snapshot-send wrapper\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/client/client.cpp#L384\nThe visible snapshot wrapper forwards to CClient__SendSnapshot; it is not the complete emission implementation.\n\nR8 — Server listing record\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/networksystem/serverlisting.h#L3\nListing fields include visibility, map, playlist, endpoint, compatibility data, network-key data, and player counts.\n\nR9 — Pylon API client\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/networksystem/pylon.cpp#L56\nVisible client methods query listings, find hidden servers by token, and post host listings. The directory service implementation is not present in this inspected code.\n\nR10 — Server-frame wrapper\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/server/server.cpp#L223\nRunFrame forwards to a recovered binary function pointer; the simulation body remains opaque.\n\nR11 — Game-state script\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_gamestate_mp.nut#L84\nSetGameState updates level game state, signals changes, updates a server variable, and invokes callbacks.\n\nR12 — Bleedout predicate\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/sh_bleedout.gnut#L558\nThe script checks the player bleedout state. Downed status is distinct from the alive predicate.\n\nR13 — Elimination registry\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_base_gametype.gnut#L2172\nElimination is tracked by platform UID in an EliminatedPlayers map, with a name and team record, and may be cleared.\n\nR14 — Respawn script\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/sh_respawn_beacon.gnut#L1235\nThis path clears elimination and passes the same player reference to DecideRespawnPlayer_Retail. The native respawn implementation remains opaque.\n\nR15 — Survival-mode rules\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/gamemodes/survival/_gamemode_survival.nut#L1389\nThe survival script uses team relationships, game states, and a playlist setting to decide whether bleedout is enabled.\n\nR16 — Downing script\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_bleedout.gnut#L224\nThe downing path changes player bleedout state and starts related behavior and callbacks.\n\nCONSTRAINTS\nC01 — Identity separation — Platform UID, slot index/current user ID, entity handle, and network-channel identity are distinct. Reconnect and slot reuse must not silently merge them. — Source-supported distinction; temporal identity rules inferred\nC02 — Slot capacity — The count of active/admitted clients must respect the configured maximum. Static slot storage is not the current lobby population. — R1, R2; proposed invariant\nC03 — Fake clients — Fake-client slots need not have a remote application, network channel, or real platform account. Do not fabricate account identities for bots. — R1, R2; association policy inferred\nC04 — Sign-on classification — ActiveClientSlot corresponds to sign-on state FULL. It says nothing about whether the assigned player is alive or downed. — R2 declaration\nC05 — Participation scope — An assignment, participant, assigned entity, and squad must refer to the same game session. The game-session identity boundary remains inferred. — Proposed OntoUML invariant\nC06 — Life and bleedout — ReadyPlayer means alive and not bleeding out; DownedPlayer means alive and bleeding out. Dead or observer entities may be in neither phase. — R12 motivates classification; stereotypes inferred\nC07 — Elimination dependence — Elimination status is scoped by game session and platform identity. Registry membership, not an entity-only health predicate, determines EliminatedIdentity. — R13 observation; session boundary inferred\nC08 — Respawn continuity — The inspected respawn path clears elimination and reuses a player reference. This supports script-level continuity, but does not prove native allocation or reconnect continuity. — R14 observation\nC09 — Command acceptance — A received command can be declined by the movement-time wrapper. CommandProcessing denotes accepted native execution; it does not guarantee a particular gameplay outcome. — R5 observed control flow\nC10 — Snapshot uncertainty — Do not impose one snapshot per frame or full-world contents from these declarations. Tick, frame, and snapshot-send interfaces are partially opaque. — R6, R7, R10 limits\nC11 — Directory semantics — Listing lookup is discovery, not skill matchmaking or game admission. Hidden/public classify the listing’s hidden field; offline means no publication. — R8, R9; publication relator inferred\nC12 — Version scope — Every source assertion applies to the pinned repositories supporting the named Season 3 build. Flowstate behavior can differ from original retail gameplay. — R0 and script README\n\nOPEN QUESTIONS\nNative bodies behind RunFrame, SendSnapshot, RunCommand, and native respawn calls.\nUnknown SDK layout fields and declarations explicitly marked unconfirmed.\nDirectory-service implementation, its internal persistence, and publication lifecycle.\nExact match/session identity, reconnect ownership, and slot/avatar reuse invariants.\nOriginal retail versus community changes; current EA matchmaking is outside this R5 model.\n\nVALIDATION\nOfficial OntoUML JSON schema validation with format checks\nLossless ontouml-js parse/serialize round trip\nRole/phase identity suppliers and role dependence\nRelators with two mandatory mediated ends\nEvent and intrinsic-aspect relation direction
