<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>R5Reloaded / Apex Season 3 | OntoUML Atlas</title>
    <style>
      :root {
  color-scheme: dark;
  --canvas: #22272e;
  --surface: #2d333b;
  --text: #cdd9e5;
  --muted: #909dab;
  --border: #444c56;
  --hover: #373e47;
  --focus: #539bf5;
  --selected-bg: #4184e426;
  --selected-hover: #539bf536;
  --selected-text: #cdd9e5;
  --link: #6cb6ff;
  --grid: #373e47;
  --accent: #6cb6ff;
  --shadow: #1c212866;
  --tab-indicator: #ec775c;
  --toolbar-height: 56px;
  --control-bg: #373e47;
  --control-hover: #444c56;
  --control-active: #2e353e;
  --border-muted: #373e47;
  --inspector-width: clamp(440px, 42vw, 640px);
}
:root[data-theme="light"] {
  color-scheme: light;
  --canvas: #ffffff;
  --surface: #f6f8fa;
  --text: #1f2328;
  --muted: #59636e;
  --border: #d1d9e0;
  --hover: #f0f2f5;
  --focus: #0969da;
  --selected-bg: #0969da1a;
  --selected-hover: #0969da26;
  --selected-text: #1f2328;
  --link: #0969da;
  --grid: #d1d9e0;
  --accent: #0969da;
  --shadow: #1f23281f;
  --tab-indicator: #fd8c73;
  --control-bg: #f6f8fa;
  --control-hover: #eef1f4;
  --control-active: #e4e8ec;
  --border-muted: #d8dee4;
}

:root {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    Segoe UI,
    "Noto Sans",
    Helvetica,
    Arial,
    sans-serif;
  color: var(--text);
  background: var(--canvas);
  font-size: 14px;
}
* {
  box-sizing: border-box;
  scrollbar-color: var(--border) var(--surface);
  scrollbar-width: thin;
}
body {
  margin: 0;
  overflow: hidden;
}
button,
input,
a {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 6px;
  height: 32px;
  padding: 0 11px;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 500;
}
button:hover {
  background: var(--hover);
}
button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
button[aria-pressed="true"],
button[aria-selected="true"] {
  background: var(--selected-bg);
  color: var(--selected-text);
}
.viewer-toolbar {
  position: relative;
  z-index: 10;
  height: var(--toolbar-height);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.toolbar-identity {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  color: var(--text);
}
.toolbar-actions,
.diagram-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.view-navigation {
  min-width: 0;
}
.tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  height: var(--toolbar-height);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs button {
  position: relative;
  flex: none;
  height: 34px;
  padding: 0 10px;
  font-weight: 500;
}
.tabs button[aria-selected="true"] {
  background: transparent;
  color: var(--text);
  font-weight: 600;
}
.tabs button[aria-selected="true"]::after {
  content: "";
  position: absolute;
  inset: auto 2px -11px;
  height: 2px;
  border-radius: 2px;
  background: var(--tab-indicator);
}
.spacer {
  flex: 1;
}
.search {
  position: relative;
  width: clamp(160px, 18vw, 240px);
  font-size: 12px;
}
.search input {
  width: 100%;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--canvas);
  padding: 0 30px 0 32px;
  color: inherit;
}
.search-icon {
  position: absolute;
  left: 10px;
  top: 8px;
  color: var(--muted);
  pointer-events: none;
}
.search-shortcut {
  position: absolute;
  right: 8px;
  top: 6px;
  width: 18px;
  height: 20px;
  line-height: 18px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  pointer-events: none;
}
.search:focus-within .search-shortcut {
  display: none;
}
.suggestions {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  top: 36px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 7px 25px var(--shadow);
  border-radius: 8px;
  max-height: 280px;
  overflow: auto;
}
.suggestions.open {
  display: block;
}
.suggestions button {
  display: flex;
  justify-content: flex-start;
  text-align: left;
  width: 100%;
  padding: 0 8px;
  font-size: 12px;
}
.camera-controls {
  display: flex;
  align-items: center;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--control-bg);
  height: 32px;
  overflow: hidden;
}
.icon {
  padding: 0;
  width: 32px;
  flex: none;
  border: 1px solid var(--border);
  background: var(--control-bg);
}
.icon:hover,
.fields:hover,
.learn-toggle:hover {
  background: var(--control-hover);
}
.camera-controls .icon {
  border: 0;
  border-radius: 0;
  background: transparent;
  width: 28px;
  height: 30px;
}
.camera-controls .icon:hover,
.tabs button:hover {
  background: var(--control-hover);
}
.camera-controls button:focus-visible {
  outline-offset: -3px;
}
.camera-controls button {
  height: 30px;
  border-radius: 0;
}
.camera-controls #fit {
  border-left: 1px solid var(--border);
  width: 32px;
  padding: 0;
}
.zoom-readout {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  min-width: 50px;
  padding: 0 6px;
}
.fields {
  width: 32px;
  padding: 0;
  border: 1px solid var(--border);
  background: var(--control-bg);
  font-weight: 500;
}
.fields[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--selected-bg);
}
.learn-toggle {
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--control-bg);
}
.divider {
  height: 20px;
  width: 1px;
  background: var(--border);
}
.menu-wrap {
  position: relative;
}
.menu {
  display: none;
  position: absolute;
  right: 0;
  top: 38px;
  min-width: 190px;
  padding: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 7px 25px var(--shadow);
}
.menu.open {
  display: block;
}
.menu a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 4px;
  text-decoration: none;
  color: var(--text);
}
.menu a svg {
  color: var(--muted);
}
.menu a:hover {
  background: var(--hover);
}
.panel {
  display: none;
  position: fixed;
  z-index: 9;
  right: 14px;
  top: calc(var(--toolbar-height) + 12px);
  width: 360px;
  max-height: calc(100dvh - var(--toolbar-height) - 24px);
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  box-shadow: 0 8px 32px var(--shadow);
  padding: 0;
  user-select: text;
}
.panel-header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 52px;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-size: 13px;
  font-weight: 600;
}
.panel-header.compact {
  height: 40px;
  justify-content: flex-end;
  border-bottom: 0;
  background: var(--canvas);
}
.panel-content {
  padding: 20px;
}
.panel.open {
  display: block;
}
.panel-close {
  margin-right: -6px;
  border: 0;
  background: transparent;
}
.panel h1 {
  font-size: 16px;
  line-height: 1.5;
  margin: 0 0 12px;
  overflow-wrap: anywhere;
}
.tag {
  font-size: 12px;
  color: var(--muted);
  display: inline-block;
  padding: 1px 7px;
  line-height: 18px;
  border: 1px solid var(--border);
  border-radius: 20px;
}
.panel p {
  font-size: 12px;
  line-height: 1.65;
  margin: 10px 0;
}
.panel h2 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: normal;
  color: var(--text);
  margin: 20px 0 10px;
}
.detail-header h1 {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-weight: 600;
}
.detail-header h1 svg {
  color: var(--muted);
  flex: none;
  margin-top: 5px;
}
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.detail-description {
  margin-top: 16px;
}
.detail-description p {
  color: var(--muted);
}
.source-evidence {
  margin-top: 20px;
}
.stereotype-tag[data-stereotype="kind"] {
  color: var(--type-kind);
}
.stereotype-tag[data-stereotype="role"] {
  color: var(--type-role);
}
.stereotype-tag[data-stereotype="relator"] {
  color: var(--type-relator);
}
.stereotype-tag[data-stereotype="phase"] {
  color: var(--type-phase);
}
.stereotype-tag[data-stereotype="event"] {
  color: var(--type-event);
}
.stereotype-tag[data-stereotype="mode"] {
  color: var(--type-mode);
}
.panel a {
  color: var(--link);
  text-decoration: none;
}
.panel a:hover {
  text-decoration: underline;
}
.source {
  display: block;
  font-size: 12px;
  margin: 10px 0;
  line-height: 1.5;
}
.field-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
}
.field-row span:last-child {
  color: var(--muted);
  text-align: right;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 9px 0;
  font-size: 12px;
}
.swatch {
  width: 15px;
  height: 15px;
  border: 1px solid var(--diagram-border);
  border-radius: 3px;
}
.panel kbd {
  font: 11px inherit;
  background: var(--hover);
  padding: 2px 5px;
  border-radius: 3px;
}
.muted {
  color: var(--muted);
}
@media (max-width: 1060px) {
  .viewer-toolbar {
    gap: 6px;
    padding: 0 8px;
  }
  .search {
    width: 160px;
  }
  .toolbar-actions {
    gap: 6px;
  }
}
@media (max-width: 780px) {
  :root {
    --toolbar-height: 100px;
  }
  .viewer-toolbar {
    align-items: flex-start;
    padding-top: 10px;
  }
  .toolbar-actions {
    margin-left: auto;
  }
  .view-navigation {
    position: absolute;
    left: 8px;
    bottom: 0;
    right: 186px;
  }
  .tabs {
    height: 44px;
  }
  .tabs button[aria-selected="true"]::after {
    bottom: -6px;
  }
  .diagram-actions {
    position: absolute;
    right: 8px;
    bottom: 6px;
  }
  .search {
    display: none;
  }
  .tabs button {
    font-size: 12px;
    padding: 0 8px;
  }
  .zoom-readout {
    min-width: 43px;
  }
  .panel {
    right: 8px;
    width: min(360px, calc(100vw - 16px));
  }
  .viewer-toolbar {
    gap: 4px;
  }
}
#search-toggle {
  display: none;
}
@media (max-width: 780px) {
  #search-toggle {
    display: block;
  }
  .search {
    position: absolute;
    right: 8px;
    left: 8px;
    top: calc(var(--toolbar-height) + 8px);
    width: auto;
    background: var(--surface);
    padding: 7px;
    border-radius: 8px;
    box-shadow: 0 7px 25px var(--shadow);
  }
  .search.open {
    display: block;
  }
  .search .suggestions {
    top: 42px;
  }
  .search-icon {
    top: 15px;
    left: 17px;
  }
  .search-shortcut {
    top: 13px;
    right: 15px;
  }
}
input::placeholder {
  color: var(--muted);
}

.relation-end {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-muted);
}
.relation-end button {
  padding: 0;
  color: var(--link);
  text-align: left;
  height: auto;
  min-height: 28px;
  overflow-wrap: anywhere;
  white-space: normal;
}
.count-badge {
  flex: none;
  padding: 3px 8px;
  border: 1px solid var(--diagram-border);
  border-radius: 5px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  color: var(--text);
}
.about-panel {
  right: auto;
  left: 14px;
}
.inspector {
  top: var(--toolbar-height);
  right: 0;
  width: var(--inspector-width);
  height: calc(100dvh - var(--toolbar-height));
  max-height: none;
  border: 0;
  border-left: 1px solid var(--border);
  border-radius: 0;
  padding: 0;
  background: var(--canvas);
  box-shadow: none;
}
.inspector .panel-content {
  padding: 8px 24px 24px;
}
.viewer.inspecting #canvas {
  right: var(--inspector-width);
}
.inspector h1 {
  font-size: 20px;
}
.inspector p {
  font-size: 13px;
}
.inspector .code-snippet {
  font-size: 12px;
}
@media (max-width: 900px) {
  :root {
    --inspector-width: 400px;
  }
  .inspector {
    padding: 0;
  }
  .inspector .panel-content {
    padding: 8px 20px 20px;
  }
}
@media (max-width: 680px) {
  .inspector {
    width: min(440px, 100vw);
  }
  .viewer.inspecting #canvas {
    right: 0;
  }
}
.source-path {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.source-file-card {
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.source-path svg {
  flex: none;
}
.source-filename {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.source-language {
  margin-left: auto;
  font-size: 11px;
  flex: none;
}
.source-file-card .code-snippet {
  border: 0;
  border-radius: 0;
}
.source-file-card .code-snippet:focus-visible {
  outline-offset: -2px;
}
.source-footer {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.code-snippet {
  margin: 0;
  padding: 10px 0;
  border: 1px solid var(--border);
  border-radius: 0 0 6px 6px;
  background: var(--canvas);
  color: var(--text);
  overflow: auto;
  font:
    11px/1.65 ui-monospace,
    SFMono-Regular,
    SF Mono,
    Menlo,
    Consolas,
    "Liberation Mono",
    monospace;
  tab-size: 2;
}
.code-snippet:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.code-line::before {
  content: attr(data-line);
  display: inline-block;
  position: sticky;
  left: 0;
  width: 40px;
  padding: 0 10px;
  margin-right: 8px;
  color: var(--muted);
  background: var(--canvas);
  text-align: right;
  user-select: none;
}
.shiki .code-line > span {
  color: var(--shiki-dark);
  font-style: var(--shiki-dark-font-style);
  font-weight: var(--shiki-dark-font-weight);
}
:root[data-theme="light"] .shiki .code-line > span {
  color: var(--shiki-light);
  font-style: var(--shiki-light-font-style);
  font-weight: var(--shiki-light-font-weight);
}
.source-github {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  margin-top: 0;
}
.additional-source,
.concept-fields {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.panel summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
.panel summary:hover {
  color: var(--text);
}
.additional-source .source-excerpt {
  margin-top: 10px;
}
.evidence-status {
  color: var(--muted);
}
.learning-tabs {
  display: flex;
  gap: 4px;
  margin: 0 0 16px;
  padding: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 6px;
}
.learning-tabs button {
  flex: 1;
  height: 30px;
  font-size: 12px;
  padding: 0 8px;
}
.learning-tabs button[aria-pressed="true"] {
  color: var(--text);
  background: var(--control-bg);
  box-shadow: 0 1px 3px var(--shadow);
}
.learning-search {
  width: 100%;
  padding: 8px 10px;
  color: var(--text);
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 12px;
}
.learn-concept,
.finding {
  border-top: 1px solid var(--border-muted);
  padding-top: 16px;
  margin-top: 16px;
}
.learn-concept summary,
.finding summary {
  line-height: 1.6;
  color: var(--text);
}
.finding summary {
  color: var(--diagram-selection);
}
.learning-question {
  border-left: 2px solid var(--link);
  padding-left: 12px;
}
.lesson .source {
  margin-bottom: 14px;
}
.validation-count {
  display: inline-block;
  font-size: 11px;
  border-radius: 12px;
  padding: 1px 6px;
  margin-left: 0;
  min-width: 20px;
  text-align: center;
  color: var(--text);
  background: var(--border);
}
.validation-issue {
  border-top: 1px solid var(--border);
  padding: 14px 0;
}
.validation-issue.info {
  opacity: 0.8;
}
.issue-link {
  color: var(--link);
  padding: 0;
}
.answer-button {
  border: 1px solid var(--border);
}
.open-question {
  border-left: 2px solid var(--border);
  padding-left: 12px;
}
.viewer-error {
  max-width: 520px;
  margin: 15vh auto;
  padding: 24px;
}
.viewer button[aria-pressed="true"],
.viewer button[aria-expanded="true"] {
  border-color: var(--accent);
}
.viewer button[aria-expanded="true"] {
  background: var(--selected-bg);
}
.viewer button:is([aria-pressed="true"], [aria-expanded="true"]):hover {
  background: var(--selected-hover);
}
.tabs button[aria-selected="true"]:hover {
  background: var(--control-hover);
}
.panel details[open] > summary {
  color: var(--text);
  background: var(--selected-bg);
  border-radius: 4px;
}
.panel details > summary:hover {
  background: var(--hover);
  border-radius: 4px;
}
.viewer button:not(:disabled):active,
.menu a:active,
.panel details > summary:active {
  background: var(--control-active);
  box-shadow: inset 0 1px 3px var(--shadow);
}
.panel a:active {
  color: var(--focus);
  text-decoration: underline;
}
.search input:hover,
.learning-search:hover {
  border-color: var(--muted);
}
button:disabled {
  opacity: 0.5;
  cursor: default;
}
@media (max-width: 680px) {
  .learn-toggle {
    padding: 0 6px;
  }
  .learning-tabs {
    flex-wrap: wrap;
  }
}

@media (prefers-reduced-motion: reduce) {
  .diagram-element {
    transition: none;
  }
}

.atlas-capture {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 2;
  max-width: calc(100% - 24px);
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  background: var(--canvas);
  font-size: 11px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

:root {
  --diagram-border: #768390;
  --diagram-divider: #636e7b;
  --diagram-edge: #909dab;
  --diagram-inheritance: #adbac7;
  --diagram-label: #cdd9e5;
  --diagram-muted: #909dab;
  --diagram-attribute: #adbac7;

#canvas {
  position: fixed;
  inset: var(--toolbar-height, 50px) 0 0;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  cursor: grab;
  background-color: var(--canvas);
  user-select: none;
}
.canvas-grid {
  position: absolute;
  inset: -64px;
  pointer-events: none;
  background-image: radial-gradient(var(--grid) 0.7px, transparent 0.7px);
  background-size: 20px 20px;
  will-change: transform;
}
#canvas.dragging {
  cursor: grabbing;
}
#world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#world svg {
  display: block;
  overflow: visible;
}
.uml-diagram {
  position: relative;
}
.diagram-base {
  will-change: opacity;
}
.diagram-base,
.diagram-background {
  transition: opacity 100ms ease-out;
}
.diagram-background {
  position: absolute;
  inset: 0;
  visibility: hidden;
  pointer-events: none;
  will-change: opacity;
}
.diagram-background.ready {
  visibility: visible;
}
.diagram-hit-layer {
  opacity: 0;
}
.uml-diagram.has-focus > .diagram-base,
.uml-diagram.has-focus > .diagram-background {
  opacity: 0.22;
}
.diagram-overlay {
  position: absolute;
  inset: 0;
  will-change: transform;
  animation: highlight-enter 80ms ease-out;
}
@keyframes highlight-enter {
  from {
    opacity: 0.7;
  }
  to {
    opacity: 1;
  }
}
.diagram-overlay,
.diagram-overlay *,
.diagram-overlay .edge-label {
  pointer-events: none;
}
.node {
  cursor: pointer;
  outline: none;
}
.node:hover .node-box,
.node:focus-visible .node-box {
  stroke: var(--accent);
  stroke-width: 2;
}
.diagram-base .node:hover .node-box,
.diagram-base .node:focus-visible .node-box {
  stroke: var(--diagram-border);
  stroke-width: 1.25;
}
svg.has-focus .diagram-element {
  opacity: 0.22;
}
svg.has-focus .diagram-element.highlighted {
  opacity: 1;
}
.node.dimmed,
.edge.dimmed {
  opacity: 0.22;
}
.node.highlighted .node-box {
  stroke: var(--accent);
  stroke-width: 2;
}
.node.primary .node-box {
  stroke: var(--diagram-selection);
  stroke-width: 3;
}
.node.primary.selected .node-box {
  stroke-width: 3.5;
}
.edge {
  outline: none;
  cursor: pointer;
}
.edge.highlighted .edge-path,
.edge:focus-visible .edge-path {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.edge.highlighted .multiplicity rect {
  stroke: var(--accent);
  stroke-width: 1.4;
}
.diagram-base .edge:focus-visible .edge-path {
  stroke: var(--diagram-edge);
  stroke-width: 1.4;
}
.diagram-base .generalization:focus-visible .edge-path {
  stroke: var(--diagram-inheritance);
}
.edge.highlighted .edge-label text {
  fill: var(--accent);
}
.edge.primary .edge-path {
  stroke: var(--diagram-selection);
  stroke-width: 3;
}
.edge.primary.selected .edge-path {
  stroke-width: 3.5;
}
.edge.primary .multiplicity rect {
  stroke: var(--diagram-selection);
}
.edge.primary .edge-label text,
.edge.primary .edge-label tspan {
  fill: var(--diagram-selection);
}
.edge-label {
  pointer-events: all;
}
@media (prefers-reduced-motion: reduce) {
  .diagram-base,
  .diagram-background {
    transition: none;
  }
  .diagram-overlay {
    animation: none;
  }
}

      const MODEL={"id":"project-r5-season-3","title":"R5Reloaded / Apex Season 3","version":"0.2","date":"2026-10-06","status":"Public-source interpretation; native engine internals partially opaque","repositories":[{"repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf"},{"repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578"}],"sources":[{"id":"R0","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"README.md","anchor":"S3 `R5pc","title":"Supported Apex Season 3 build","claim":"The SDK targets R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM and requires existing game executables.","line":42,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/README.md#L42"},{"id":"R1","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/engine/server/server.h","anchor":"class CServer :","title":"CServer declaration","claim":"Exposes server state, tick count and interval, client storage, capacity, map, and dedicated-server status.","line":30,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/server/server.h#L30"},{"id":"R2","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/engine/client/client.h","anchor":"class CClient :","title":"CClient declaration","claim":"Server-side client records distinguish user ID, Nucleus identity, channel, sign-on stage, fake-client flag, and replication ticks.","line":64,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/client/client.h#L64"},{"id":"R3","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/engine/net_chan.h","anchor":"class CNetChan\r","title":"Network channel declaration","claim":"Exposes endpoint, sequence and acknowledgement state, message handling, and reliable/unreliable streams.","line":28,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/net_chan.h#L28"},{"id":"R4","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/game/shared/usercmd.h","anchor":"class CUserCmd\r","title":"Input command declaration","claim":"Exposes sequence, tick, command time, movement, buttons, view angles, and frame time; unknown fields remain.","line":29,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/game/shared/usercmd.h#L29"},{"id":"R5","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/game/server/player_command.cpp","anchor":"void CPlayerMove::StaticRunCommand","title":"Command-processing wrapper","claim":"The SDK can decline command processing based on a movement-time budget, then delegates accepted processing to the binary.","line":25,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/game/server/player_command.cpp#L25"},{"id":"R6","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/engine/framesnapshot.h","anchor":"struct CFrameSnapshot","title":"Partial snapshot declaration","claim":"A partial recovered layout includes tick-update data and entity-oriented buffers. Most fields remain unidentified.","line":5,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/framesnapshot.h#L5"},{"id":"R7","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf","file":"src/engine/client/client.cpp","anchor":"void* CClient::VSendSnapshot","title":"Snapshot-send wrapper","claim":"The visible snapshot wrapper forwards to CClient__SendSnapshot; it is not the complete emission implementation.","line":384,"url":"https://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/client/client.cpp#L384"},{"id":"R8","repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c anges player bleedout state and starts related behavior and callbacks.","line":224,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_bleedout.gnut#L224"}],"constraints":[["C01","Identity separation","Platform UID, slot index/current user ID, entity handle, and network-channel identity are distinct. Reconnect and slot reuse must not silently merge them.","Source-supported distinction; temporal identity rules inferred"],["C02","Slot capacity","The count of active/admitted clients must respect the configured maximum. Static slot storage is not the current lobby population.","R1, R2; proposed invariant"],["C03","Fake clients","Fake-client slots need not have a remote application, network channel, or real platform account. Do not fabricate account identities for bots.","R1, R2; association policy inferred"],["C04","Sign-on classification","ActiveClientSlot corresponds to sign-on state FULL. It says nothing about whether the assigned player is alive or downed.","R2 declaration"],["C05","Participation scope","An assignment, participant, assigned entity, and squad must refer to the same game session. The game-session identity boundary remains inferred.","Proposed OntoUML invariant"],["C06","Life and bleedout","ReadyPlayer means alive and not bleeding out; DownedPlayer means alive and bleeding out. Dead or observer entities may be in neither phase.","R12 motivates classification; stereotypes inferred"],["C07","Elimination dependence","Elimination status is scoped by game session and platform identity. Registry membership, not an entity-only health predicate, determines EliminatedIdentity.","R13 observation; session boundary inferred"],["C08","Respawn continuity","The inspected respawn path clears elimination and reuses a player reference. This supports script-level continuity, but does not prove native allocation or reconnect continuity.","R14 observation"],["C09","Command acceptance","A received command can be declined by the movement-time wrapper. CommandProcessing denotes accepted native execution; it does not guarantee a particular gameplay outcome.","R5 observed control flow"],["C10","Snapshot uncertainty","Do not impose one snapshot per frame or full-world contents from these declarations. Tick, frame, and snapshot-send interfaces are partially opaque.","R6, R7, R10 limits"],["C11","Directory semantics","Listing lookup is discovery, not skill matchmaking or game admission. Hidden/public classify the listing’s hidden field; offline means no publication.","R8, R9; publication relator inferred"],["C12","Version scope","Every source assertion applies to the pinned repositories supporting the named Season 3 build. Flowstate behavior can differ from original retail gameplay.","R0 and script README"]],"unknowns":["Native bodies behind RunFrame, SendSnapshot, RunCommand, and native respawn calls.","Unknown SDK layout fields and declarations explicitly marked unconfirmed.","Directory-service implementation, its internal persistence, and publication lifecycle.","Exact match/session identity, reconnect ownership, and slot/avatar reuse invariants.","Original retail versus community changes; current EA matchmaking is outside this R5 model."],"classes":[{"id":"datatype-Text","name":"Text","stereotype":"datatype","packageId":"package-types","description":"","isAbstract":false,"evidence":[],"attributes":[]},{"id":"datatype-Integer","name":"Integer","stereotype":"datatype","packageId":"package-types","description":"","isAbstract":false,"evidence":[],"attributes":[]},{"id":"datatype-Decimal","name":"Decimal","stereotype":"datatype","packageId":"package-types","description":"","isAbstract":false,"evidence":[],"attributes":[]},{"id":"datatype-Vector3","name":"Vector3","stereotype":"datatype","packageId":"package-types","description":"","isAbstract":false,"evidence":[],"attributes":[]},{"id":"datatype-Boolean","name":"Boolean","stereotype":"datatype","packageId":"package-types","description":"
