<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>R5 · OntoUML</title>
    <style>
      :root {
        font-family:
          Inter,
          Segoe UI,
          Arial,
          sans-serif;
        color: #26354c;
        background: #fafbfe;
        font-size: 13px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      button,
      input,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 6px;
        height: 32px;
        padding: 0 11px;
        white-space: nowrap;
      }
      button:hover {
        background: #edf0f6;
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid #5876db;
        outline-offset: 2px;
      }
      button[aria-pressed="true"],
      button[aria-selected="true"] {
        background: #e7edfc;
        color: #3655a3;
      }
      header {
        position: relative;
        z-index: 10;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: #fff;
        border-bottom: 1px solid #e2e7ef;
      }
      .brand {
        font-weight: 650;
        letter-spacing: 0.03em;
        color: #4c5b73;
        margin-right: 3px;
      }
      .tabs {
        display: flex;
        gap: 3px;
      }
      .spacer {
        flex: 1;
      }
      .search {
        position: relative;
        width: 190px;
      }
      .search input {
        width: 100%;
        height: 30px;
        border: 1px solid #e3e8f0;
        border-radius: 6px;
        background: #fafbfe;
        padding: 0 10px;
        color: inherit;
      }
      .suggestions {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 36px;
        padding: 4px;
        background: white;
        border: 1px solid #e2e7ef;
        box-shadow: 0 7px 25px #24344c15;
        border-radius: 8px;
        max-height: 280px;
        overflow: auto;
      }
      .suggestions.open {
        display: block;
      }
      .suggestions button {
        display: block;
        text-align: left;
        width: 100%;
        padding: 0 8px;
        font-size: 12px;
      }
      .camera-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        border-left: 1px solid #e7ebf2;
        padding-left: 8px;
      }
      .icon {
        padding: 0;
        width: 30px;
        font-size: 18px;
      }
      .zoom-readout {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        min-width: 50px;
        padding: 0 6px;
      }
      .fields {
        font-size: 12px;
      }
      .divider {
        height: 20px;
        width: 1px;
        background: #e5e9f0;
      }
      .menu-wrap {
        position: relative;
      }
      .menu {
        display: none;
        position: absolute;
        right: 0;
        top: 38px;
        min-width: 190px;
        padding: 5px;
        background: #fff;
        border: 1px solid #e2e7ef;
        border-radius: 8px;
        box-shadow: 0 7px 25px #24344c15;
      }
      .menu.open {
        display: block;
      }
      .menu a {
        display: block;
        padding: 9px 10px;
        border-radius: 4px;
        text-decoration: none;
        color: #354866;
      }
      .menu a:hover {
        background: #edf0f6;
      }
      #canvas {
        position: fixed;
        inset: 50px 0 0;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        cursor: grab;
        background-color: #fafbfe;
        background-image: radial-gradient(#d9e0eb 0.7px, transparent 0.7px);
        background-size: 20px 20px;
        user-select: none;
      }
      #canvas.dragging {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      #world svg {
        display: block;
        overflow: visible;
      }
      .node {
        cursor: pointer;
        outline: none;
      }
      .node:hover .node-box,
      .node:focus-visible .node-box {
        stroke: #5577cc;
        stroke-width: 2;
      }
      .node.selected .node-box {
        stroke: #486bd0;
        stroke-width: 2.5;
      }
      .node.dimmed {
        opacity: 0.27;
      }
      .edge-label {
        pointer-events: none;
      }
      .panel {
        display: none;
        position: fixed;
        z-index: 9;
        right: 14px;
        top: 64px;
        width: 310px;
        max-height: calc(100vh - 80px);
        overflow: auto;
        border: 1px solid #dfe5ee;
        border-radius: 10px;
        background: #fffffffa;
        box-shadow: 0 8px 32px #29395414;
        padding: 18px;
        user-select: text;
      }
      .panel.open {
        display: block;
      }
      .panel-close {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 20px;
      }
      .panel h1 {
        font-size: 17px;
        line-height: 1.3;
        margin: 9px 20px 14px 0;
        overflow-wrap: anywhere;
      }
      .tag {
        font-size: 11px;
        color: #748097;
      }
      .panel p {
        font-size: 12px;
        line-height: 1.65;
        margin: 10px 0;
      }
      .panel h2 {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #7c889b;
        margin: 22px 0 9px;
      }
      .panel a {
        color: #496baf;
        text-decoration: none;
      }
      .panel a:hover {
        text-decoration: underline;
      }
      .source {
        display: block;
        font-size: 12px;
        margin: 10px 0;
        line-height: 1.5;
      }
      .field-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        font-size: 11px;
        border-bottom: 1px solid #edf0f5;
      }
      .field-row span:last-child {
        color: #758298;
        text-align: right;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 9px 0;
        font-size: 12px;
      }
      .swatch {
        width: 15px;
        height: 15px;
        border: 1px solid #8999af;
        border-radius: 3px;
      }
      .panel kbd {
        font: 11px inherit;
        background: #f0f3f8;
        padding: 2px 5px;
        border-radius: 3px;
      }
      .muted {
        color: #7c889b;
      }
      @media (max-width: 900px) {
        header {
          gap: 6px;
          padding: 0 8px;
        }
        .brand {
          display: none;
        }
        .search {
          width: 150px;
        }
        .camera-controls {
          padding-left: 4px;
        }
        .fields {
          padding: 0 7px;
        }
      }
      @media (max-width: 680px) {
        .search {
          display: none;
        }
        .tabs button {
          font-size: 12px;
          padding: 0 8px;
        }
        .zoom-readout {
          min-width: 43px;
        }
        .camera-controls {
          gap: 0;
        }
        .panel {
          right: 8px;
          width: min(310px, calc(100vw - 16px));
        }
        header {
          gap: 4px;
        }
      }
      #search-toggle {
        display: none;
      }
      @media (max-width: 680px) {
        #search-toggle {
          display: block;
        }
        .search {
          position: absolute;
          right: 160px;
          top: 58px;
          width: 230px;
          background: white;
          padding: 7px;
          border-radius: 8px;
          box-shadow: 0 7px 25px #24344c15;
        }
        .search.open {
          display: block;
        }
        .search .suggestions {
          top: 42px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand" title="R5Reloaded · Apex Season 3">R5 · S3</span>
      <nav class="tabs" aria-label="Diagram">
        <button data-view="runtime" aria-selected="true">Game server</button
        ><button data-view="backend" aria-selected="false">
          Server browser
        </button>
      </nav>
      <span class="spacer"></span>
      <button
        id="search-toggle"
        class="icon"
        aria-label="Open concept search"
        title="Find concept"
      >
        ⌕
      </button>
      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Find concept…"
          aria-label="Find concept"
          autocomplete="off"
        />
        <div
          id="suggestions"
          class="suggestions"
          role="listbox"
          aria-label="Concepts"
        ></div>
      </div>
      <button
        id="fields"
        class="fields"
        aria-pressed="false"
        title="Show attributes in the diagram"
      >
        Fields
      </button>
      <div class="camera-controls">
        <button
          id="zoom-out"
          class="icon"
          aria-label="Zoom out"
          title="Zoom out (−)"
        >
          −</button
        ><button id="zoom-value" class="zoom-readout" title="Reset to 100%">
          100%</button
        ><button
          id="zoom-in"
          class="icon"
          aria-label="Zoom in"
          title="Zoom in (+)"
        >
          +</button
        ><button id="fit" title="Fit diagram (0)">Fit</button>
      </div>
      <span class="divider"></span>
      <div class="menu-wrap">
        <button
          id="export"
          class="icon"
          aria-label="Export"
          aria-expanded="false"
          title="Export"
        >
          ↓
        </button>
        <div id="export-menu" class="menu">
          <a id="svg-download" href="downloads/r5-runtime.svg" download
            >Diagram · SVG</a
          ><a id="puml-download" href="downloads/r5-runtime.puml" download
            >Diagram · PlantUML</a
          ><a id="model-download" href="downloads/r5-ontouml.json" download
            >Model · OntoUML JSON</a
          ><a id="bundle-download" href="downloads/r5-models.zip" download
            >Models · ZIP</a
          >
        </div>
      </div>
      <button
        id="info"
        class="icon"
        aria-label="About and controls"
        title="About and controls"
      >
        ⓘ
      </button>
    </header>
    <main id="canvas" aria-label="Interactive OntoUML diagram">
      <div id="world"></div>
    </main>
    <aside id="panel" class="panel" aria-label="Diagram details">
      <button class="panel-close" aria-label="Close details">×</button>
      <div id="panel-content"></div>
    </aside>
    <script>
      const MODEL={"title":"R5Reloaded / Apex Season 3","version":"0.2","date":"2026-10-06","targetBuild":"R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM","status":"Public-source static inspection; native engine internals partially opaque","repositories":[{"repo":"Mauler125/r5sdk","commit":"c49e0d2123bc3ddb53419005ddd7c6ef73925faf"},{"repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578"}],"classes":[{"name":"GameServer","stereo":"kind","pkg":"shared","description":"An identified engine-side server resource, distinct from its hosting process and gameplay occurrences.","evidence":["R1"],"attrs":[["runtimeIdentity","Text"],["serverState","Text"],["tickCount","Integer"],["tickInterval","Decimal"],["maxClients","Integer"],["isDedicated","Boolean"]],"id":"class-GameServer"},{"name":"GameSession","stereo":"kind","pkg":"shared","description":"A conceptual identity for the current level and game roster. No literal match ID was recovered; the boundary is a modeling hypothesis.","evidence":["R1","R11"],"attrs":[["sessionIdentity","Text"],["spawnCount","Integer"],["gameState","Text"]],"id":"class-GameSession"},{"name":"PlaylistConfig","stereo":"kind","pkg":"shared","description":"A mode configuration artifact used by server and gameplay scripts; the exact file and override lifecycle is not reconstructed.","evidence":["R8","R15"],"attrs":[["playlistName","Text"]],"id":"class-PlaylistConfig"},{"name":"PlatformIdentity","stereo":"kind","pkg":"shared","description":"An identity distinguished by a platform/persona UID. Slot-local user IDs do not supply this identity. Real identities and placeholder bot IDs must be distinguished.","evidence":["R2","R13"],"attrs":[["platformUid","Text"]],"id":"class-PlatformIdentity"},{"name":"ClientApplication","stereo":"kind","pkg":"shared","description":"The remote game application as a runtime resource. Its process structure is abstracted rather than equated with CClient.","evidence":["R0","R9"],"attrs":[],"id":"class-ClientApplication"},{"name":"DirectoryService","stereo":"kind","pkg":"backend","description":"The opaque Pylon service endpoint reached by the SDK API client. Its internal objects, storage, and deployment are unresolved.","evidence":["R9"],"attrs":[["endpointIdentity","Text"]],"id":"class-DirectoryService"},{"name":"ServerListing","stereo":"kind","pkg":"backend","description":"An identified advertisement information artifact describing a game server. It is separate from the server it describes.","evidence":["R8"],"attrs":[["name","Text"],["hidden","Boolean"],["mapName","Text"],["playlistName","Text"],["address","Text"],["port","Integer"],["numPlayers","Integer"],["maxPlayers","Integer"],["versionId","Text"]],"id":"class-ServerListing"},{"name":"PublishedListing","stereo":"role","pkg":"backend","description":"A listing currently published through the directory service. Publication identity and lifecycle are conceptual abstractions.","evidence":["R9"],"attrs":[],"id":"class-PublishedListing"},{"name":"ListingPublication","stereo":"relator","pkg":"backend","description":"The time-bounded publication relationship between a directory service and an advertised listing.","evidence":["R9"],"attrs":[],"id":"class-ListingPublication"},{"name":"HiddenListing","stereo":"phase","pkg":"backend","description":"A listing whose intrinsic hidden field is true; retrieval can use a token. Offline hosting is the absence of a publication, not a listing phase.","evidence":["R8","R9"],"attrs":[],"id":"class-HiddenListing"},{"name":"PublicListing","stereo":"phase","pkg":"backend","description":"A listing whose intrinsic hidden field is false.","evidence":["R8","R9"],"attrs":[],"id":"class-PublicListing"},{"name":"ListingUpdate","stereo":"event","pkg":"backend","description":"An occurrence submitting host-listing data through PostServerHost; it may create or refresh an advertisement.","evidence":["R9"],"attrs":[],"id":"class-ListingUpdate"},{"name":"ServerLookup","stereo":"event","pkg":"backend","description":"An occurrence querying a server list or looking up a listing by token. It does not itself establish a game connection.","evidence":["R9"],"attrs":[["lookupMethod","Text"]],"id":"class-ServerLookup"},{"name":"ClientSlot","stereo":"kind","pkg":"runtime","description":"A server-owned CClient resource/slot, reused across connection lifecycles. Neither the remote application nor an enduring player identity.","evidence":["R1","R2"],"attrs":[["slotIndex","Integer"],["currentUserId","Integer","0..1"],["signonStage","Text"],["fakeClient","Boolean"],["persistenceState","Text"]],"id":"class-ClientSlot"},{"name":"SessionParticipant","stereo":"role","pkg":"runtime","description":"A client slot currently admitted to a game session. Continuity across reconnect or slot reuse is not presumed.","evidence":["R1","R2"],"attrs":[],"id":"class-SessionParticipant"},{"name":"SessionParticipation","stereo":"relator","pkg":"runtime","description":"The current relationship between an admitted slot and one session. Historical player results require separate records.","evidence":["R1","R2"],"attrs":[],"id":"class-SessionParticipation"},{"name":"ActiveClientSlot","stereo":"phase","pkg":"runtime","description":"A slot with sign-on state FULL, matching CClient::IsActive; this is distinct from avatar life state.","evidence":["R2"],"attrs":[],"id":"class-ActiveClientSlot"},{"name":"NetworkChannel","stereo":"kind","pkg":"runtime","description":"A CNetChan communication resource with endpoint and sequencing state. It can exist before a player entity is active.","evidence":["R3"],"attrs":[["remoteEndpoint","Text"],["outSequence","Integer"],["inSequence","Integer"],["acknowledgedSequence","Integer"]],"id":"class-NetworkChannel"},{"name":"ClientReplicationState","stereo":"mode","pkg":"runtime","description":"Slot-specific replication/command state, modeled as an intrinsic mode rather than another player identity.","evidence":["R2"],"attrs":[["commandTick","Integer"],["deltaTick","Integer"],["snapshotTick","Integer"]],"id":"class-ClientReplicationState"},{"name":"PlayerEntity","stereo":"kind","pkg":"runtime","description":"An identified player character entity. Script-level respawn can reuse its reference; native allocation and lifetime details remain unresolved.","evidence":["R5","R14"],"attrs":[["entityHandle","Integer"],["teamNumber","Integer"],["alive","Boolean"],["bleedoutState","Text"]],"id":"class-PlayerEntity"},{"name":"AssignedPlayerEntity","stereo":"role","pkg":"runtime","description":"A player entity assigned to a session participant; this role also permits fake-client participants.","evidence":["R1","R2","R5"],"attrs":[],"id":"class-AssignedPlayerEntity"},{"name":"AvatarAssignment","stereo":"relator","pkg":"runtime","description":"The control relationship between one session participant and one assigned player entity. Exact allocation lifecycle is a hypothesis.","evidence":["R2","R5"],"attrs":[],"id":"class-AvatarAssignment"},{"name":"MatchSquad","stereo":"kind","pkg":"runtime","description":"A session-scoped team/roster abstraction grounded in team numbers and team-based script operations.","evidence":["R2","R15"],"attrs":[["teamNumber","Integer"]],"id":"class-MatchSquad"},{"name":"ReadyPlayer","stereo":"phase","pkg":"runtime","description":"A living player entity not in bleedout, using intrinsic life and bleedout state. This does not assert combat eligibility under every temporary effect.","evidence":["R12"],"attrs":[],"id":"class-ReadyPlayer"},{"name":"DownedPlayer","stereo":"phase","pkg":"runtime","description":"A living player entity in bleedout. Alive and downed are not mutually exclusive raw engine predicates.","evidence":["R12"],"attrs":[],"id":"class-DownedPlayer"},{"name":"EliminatedIdentity","stereo":"role","pkg":"runtime","description":"A platform identity with a current elimination status in this session. Source evidence is keyed by UID rather than entity life state.","evidence":["R13"],"attrs":[],"id":"class-EliminatedIdentity"},{"name":"EliminationStatus","stereo":"relator","pkg":"runtime","description":"The session-specific elimination relationship of a platform identity. The source implements its registry as information records.","evidence":["R13"],"attrs":[],"id":"class-EliminationStatus"},{"name":"GameMatch","stereo":"event","pkg":"runtime","description":"The gameplay occurrence associated with a conceptual game session; not a literal SDK class.","evidence":["R11","R15"],"attrs":[],"id":"class-GameMatch"},{"name":"ServerFrame","stereo":"event","pkg":"runtime","description":"One invocation of the visible server-frame entry point. Full simulation semantics are delegated to the binary.","evidence":["R10"],"attrs":[],"id":"class-ServerFrame"},{"name":"InputCommand","stereo":"kind","pkg":"runtime","description":"An action-request information artifact represented by CUserCmd. Receiving it does not imply that it was processed.","evidence":["R4"],"attrs":[["commandNumber","Integer"],["tickCount","Integer"],["commandTime","Decimal"],["frameTime","Decimal"],["viewAngles","Vector3"],["buttons","Integer"]],"id":"class-InputCommand"},{"name":"CommandProcessing","stereo":"event","pkg":"runtime","description":"An accepted movement-command execution passed to the native processor. Attempts rejected by the wrapper are distinct.","evidence":["R5"],"attrs":[],"id":"class-CommandProcessing"},{"name":"Snapshot","stereo":"kind","pkg":"runtime","description":"A partially understood server-state information artifact; recovered CFrameSnapshot layout does not establish a complete world-state semantics.","evidence":["R6"],"attrs":[],"id":"class-Snapshot"},{"name":"SnapshotEmission","stereo":"event","pkg":"runtime","description":"An invocation of the snapshot-send interface for one client slot. The actual encoding and emission body is not available here.","evidence":["R7"],"attrs":[],"id":"class-SnapshotEmission"},{"name":"Respawn","stereo":"event","pkg":"runtime","description":"An occurrence restoring an existing script-referenced player entity, potentially clearing its platform identity’s elimination status.","evidence":["R14"],"attrs":[],"id":"class-Respawn"},{"name":"Downing","stereo":"event","pkg":"runtime","description":"An occurrence entering player bleedout, distinct from eliminating a platform identity.","evidence":["R16"],"attrs":[],"id":"class-Downing"},{"name":"GameStateChange","stereo":"event","pkg":"runtime","description":"An occurrence of SetGameState for the current level/game context.","evidence":["R11"],"attrs":[["newState","Text"]],"id":"class-GameStateChange"}],"relations":[{"pkg":"shared","a":"GameServer","b":"GameSession","name":"current game context","stereo":null,"ac":"1","bc":"0..1","id":"relation-shared-GameServer-GameSession-current-game-context"},{"pkg":"shared","a":"GameSession","b":"PlaylistConfig","name":"configured by","stereo":null,"ac":"0..*","bc":"1","id":"relation-shared-GameSession-PlaylistConfig-configured-by"},{"pkg":"backend","a":"ListingPublication","b":"DirectoryService","name":"mediates","stereo":"mediation","ac":"0..*","bc":"1","id":"relation-backend-ListingPublication-DirectoryService-mediates"},{"pkg":"backend","a":"ListingPublication","b":"PublishedListing","name":"mediates","stereo":"mediation","ac":"1..*","bc":"1","id":"relation-backend-ListingPublication-PublishedListing-mediates"},{"pkg":"backend","a":"ServerListing","b":"GameServer","name":"advertises","stereo":null,"ac":"0..*","bc":"1","id":"relation-backend-ServerListing-GameServer-advertises"},{"pkg":"backend","a":"GameServer","b":"ListingUpdate","name":"host being advertised","stereo":"participation","ac":"1","bc":"0..*","id":"relation-backend-GameServer-ListingUpdate-host-being-advertised"},{"pkg":"backend","a":"DirectoryService","b":"ListingUpdate","name":"receives advertisement","stereo":"participation","ac":"1","bc":"0..*","id":"relation-backend-DirectoryService-ListingUpdate-receives-advertisement"},{"pkg":"backend","a":"ListingUpdate","b":"ServerListi le":"vscripts/mp/_gamestate_mp.nut","anchor":"void function SetGameState","title":"Game-state script","claim":"SetGameState updates level game state, signals changes, updates a server variable, and invokes callbacks.","line":84,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_gamestate_mp.nut#L84"},{"id":"R12","repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578","file":"vscripts/mp/sh_bleedout.gnut","anchor":"bool function Bleedout_IsBleedingOut","title":"Bleedout predicate","claim":"The script checks the player bleedout state. Downed status is distinct from the alive predicate.","line":558,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/sh_bleedout.gnut#L558"},{"id":"R13","repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578","file":"vscripts/mp/_base_gametype.gnut","anchor":"void function SetPlayerEliminated","title":"Elimination registry","claim":"Elimination is tracked by platform UID in an EliminatedPlayers map, with a name and team record, and may be cleared.","line":2172,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_base_gametype.gnut#L2172"},{"id":"R14","repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578","file":"vscripts/mp/sh_respawn_beacon.gnut","anchor":"ClearPlayerEliminated( player )","title":"Respawn script","claim":"This path clears elimination and passes the same player reference to DecideRespawnPlayer_Retail. The native respawn implementation remains opaque.","line":1235,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/sh_respawn_beacon.gnut#L1235"},{"id":"R15","repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578","file":"vscripts/gamemodes/survival/_gamemode_survival.nut","anchor":"bool function ShouldDoBleedout","title":"Survival-mode rules","claim":"The survival script uses team relationships, game states, and a playlist setting to decide whether bleedout is enabled.","line":1389,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/gamemodes/survival/_gamemode_survival.nut#L1389"},{"id":"R16","repo":"Mauler125/r5_flowstate","commit":"a2cb35fc6d249ea678578ba2df41b9b55f742578","file":"vscripts/mp/_bleedout.gnut","anchor":"void function Bleedout_StartPlayerBleedout","title":"Downing script","claim":"The downing path changes player bleedout state and starts related behavior and callbacks.","line":224,"url":"https://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_bleedout.gnut#L224"}],"constraints":[["C01","Identity separation","Platform UID, slot index/current user ID, entity handle, and network-channel identity are distinct. Reconnect and slot reuse must not silently merge them.","Source-supported distinction; temporal identity rules inferred"],["C02","Slot capacity","The count of active/admitted clients must respect the configured maximum. Static slot storage is not the current lobby population.","R1, R2; proposed invariant"],["C03","Fake clients","Fake-client slots need not have a remote application, network channel, or real platform account. Do not fabricate account identities for bots.","R1, R2; association policy inferred"],["C04","Sign-on classification","ActiveClientSlot corresponds to sign-on state FULL. It says nothing about whether the assigned player is alive or downed.","R2 declaration"],["C05","Participation scope","An assignment, participant, assigned entity, and squad must refer to the same game session. The game-session identity boundary remains inferred.","Proposed OntoUML invariant"],["C06","Life and bleedout","ReadyPlayer means alive and not bleeding out; DownedPlayer means alive and bleeding out. Dead or observer entities may be in neither phase.","R12 motivates classification; stereotypes inferred"],["C07","Elimination dependence","Elimination status is scoped by game session and platform identity. Registry membership, not an entity-only health predicate, determines EliminatedIdentity.","R13 observation; session boundary inferred"],["C08","Respawn continuity","The inspected respawn path clears elimination and reuses a player reference. This supports script-level continuity, but does not prove native allocation or reconnect continuity.","R14 observation"],["C09","Command acceptance","A received command can be declined by the movement-time wrapper. CommandProcessing denotes accepted native execution; it does not guarantee a particular gameplay outcome.","R5 observed control flow"],["C10","Snapshot uncertainty","Do not impose one snapshot per frame or full-world contents from these declarations. Tick, frame, and snapshot-send interfaces are partially opaque.","R6, R7, R10 limits"],["C11","Directory semantics","Listing lookup is discovery, not skill matchmaking or game admission. Hidden/public classify the listing’s hidden field; offline means no publication.","R8, R9; publication relator inferred"],["C12","Version scope","Every source assertion applies to the pinned repositories supporting the named Season 3 build. Flowstate behavior can differ from original retail gameplay.","R0 and script README"]],"unknowns":["Native bodies behind RunFrame, SendSnapshot, RunCommand, and native respawn calls.","Unknown SDK layout fields and declarations explicitly marked unconfirmed.","Directory-service implementation, its internal persistence, and publication lifecycle.","Exact match/session identity, reconnect ownership, and slot/avatar reuse invariants.","Original retail versus community changes; current EA matchmaking is outside this R5 model."]};const VIEWS=[{"key":"backend","title":"R5 server discovery and publication","names":["GameServer","ClientApplication","DirectoryService","ServerListing","PublishedListing"," hotEmission : \u003c\u003cparticipation>>\\nsend channel\nSnapshot \"0..*\" -- \"1\" GameSession : state context\nPlayerEntity \"1\" -- \"0..*\" Respawn : \u003c\u003cparticipation>>\\nrestored actor\nRespawn \"0..*\" -- \"0..1\" EliminationStatus : may clear\nPlayerEntity \"1\" -- \"0..*\" Downing : \u003c\u003cparticipation>>\\ndowned actor\nGameSession \"1\" -- \"0..*\" GameStateChange : \u003c\u003cparticipation>>\\nchanged context\nnote bottom of PlayerEntity : ReadyPlayer / DownedPlayer: disjoint, incomplete.\n@enduml"},"notes":"R5Reloaded / Apex Season 3 — v0.2\nTarget build: R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM\n\nMauler125/r5sdk @ c49e0d2123bc3ddb53419005ddd7c6ef73925faf\nMauler125/r5_flowstate @ a2cb35fc6d249ea678578ba2df41b9b55f742578\n\nOBSERVATIONS AND INTERPRETATIONS\nSDK declarations, wrappers, and scripts were statically inspected. Stereotypes and multiplicities are interpretations. Native engine bodies and directory-service internals remain partly opaque.\nCClient is a server-side resource, distinct from the remote application. A command can be declined by the movement wrapper. Downed players can satisfy the alive predicate. Elimination is recorded by platform UID and cleared by the inspected respawn path.\n\nSOURCE LINKS\nR0 — Supported Apex Season 3 build\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/README.md#L42\nThe SDK targets R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM and requires existing game executables.\n\nR1 — CServer declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/server/server.h#L30\nExposes server state, tick count and interval, client storage, capacity, map, and dedicated-server status.\n\nR2 — CClient declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/client/client.h#L64\nServer-side client records distinguish user ID, Nucleus identity, channel, sign-on stage, fake-client flag, and replication ticks.\n\nR3 — Network channel declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/net_chan.h#L28\nExposes endpoint, sequence and acknowledgement state, message handling, and reliable/unreliable streams.\n\nR4 — Input command declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/game/shared/usercmd.h#L29\nExposes sequence, tick, command time, movement, buttons, view angles, and frame time; unknown fields remain.\n\nR5 — Command-processing wrapper\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/game/server/player_command.cpp#L25\nThe SDK can decline command processing based on a movement-time budget, then delegates accepted processing to the binary.\n\nR6 — Partial snapshot declaration\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/framesnapshot.h#L5\nA partial recovered layout includes tick-update data and entity-oriented buffers. Most fields remain unidentified.\n\nR7 — Snapshot-send wrapper\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/client/client.cpp#L384\nThe visible snapshot wrapper forwards to CClient__SendSnapshot; it is not the complete emission implementation.\n\nR8 — Server listing record\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/networksystem/serverlisting.h#L3\nListing fields include visibility, map, playlist, endpoint, compatibility data, network-key data, and player counts.\n\nR9 — Pylon API client\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/networksystem/pylon.cpp#L56\nVisible client methods query listings, find hidden servers by token, and post host listings. The directory service implementation is not present in this inspected code.\n\nR10 — Server-frame wrapper\nhttps://github.com/Mauler125/r5sdk/blob/c49e0d2123bc3ddb53419005ddd7c6ef73925faf/src/engine/server/server.cpp#L223\nRunFrame forwards to a recovered binary function pointer; the simulation body remains opaque.\n\nR11 — Game-state script\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_gamestate_mp.nut#L84\nSetGameState updates level game state, signals changes, updates a server variable, and invokes callbacks.\n\nR12 — Bleedout predicate\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/sh_bleedout.gnut#L558\nThe script checks the player bleedout state. Downed status is distinct from the alive predicate.\n\nR13 — Elimination registry\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_base_gametype.gnut#L2172\nElimination is tracked by platform UID in an EliminatedPlayers map, with a name and team record, and may be cleared.\n\nR14 — Respawn script\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/sh_respawn_beacon.gnut#L1235\nThis path clears elimination and passes the same player reference to DecideRespawnPlayer_Retail. The native respawn implementation remains opaque.\n\nR15 — Survival-mode rules\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/gamemodes/survival/_gamemode_survival.nut#L1389\nThe survival script uses team relationships, game states, and a playlist setting to decide whether bleedout is enabled.\n\nR16 — Downing script\nhttps://github.com/Mauler125/r5_flowstate/blob/a2cb35fc6d249ea678578ba2df41b9b55f742578/vscripts/mp/_bleedout.gnut#L224\nThe downing path changes player bleedout state and starts related behavior and callbacks.\n\nCONSTRAINTS\nC01 — Identity separation — Platform UID, slot index/current user ID, entity handle, and network-channel identity are distinct. Reconnect and slot reuse must not silently merge them. — Source-supported distinction; temporal identity rules inferred\nC02 — Slot capacity — The count of active/admitted clients must respect the configured maximum. Static slot storage is not the current lobby population. — R1, R2; proposed invariant\nC03 — Fake clients — Fake-client slots need not have a remote application, network channel, or real platform account. Do not fabricate account identities for bots. — R1, R2; association policy inferred\nC04 — Sign-on classification — ActiveClientSlot corresponds to sign-on state FULL. It says nothing about whether the assigned player is alive or downed. — R2 declaration\nC05 — Participation scope — An assignment, participant, assigned entity, and squad must refer to the same game session. The game-session identity boundary remains inferred. — Proposed OntoUML invariant\nC06 — Life and bleedout — ReadyPlayer means alive and not bleeding out; DownedPlayer means alive and bleeding out. Dead or observer entities may be in neither phase. — R12 motivates classification; stereotypes inferred\nC07 — Elimination dependence — Elimination status is scoped by game session and platform identity. Registry membership, not an entity-only health predicate, determines EliminatedIdentity. — R13 observation; session boundary inferred\nC08 — Respawn continuity — The inspected respawn path clears elimination and reuses a player reference. This supports script-level continuity, but does not prove native allocation or reconnect continuity. — R14 observation\nC09 — Command acceptance — A received command can be declined by the movement-time wrapper. CommandProcessing denotes accepted native execution; it does not guarantee a particular gameplay outcome. — R5 observed control flow\nC10 — Snapshot uncertainty — Do not impose one snapshot per frame or full-world contents from these declarations. Tick, frame, and snapshot-send interfaces are partially opaque. — R6, R7, R10 limits\nC11 — Directory semantics — Listing lookup is discovery, not skill matchmaking or game admission. Hidden/public classify the listing’s hidden field; offline means no publication. — R8, R9; publication relator inferred\nC12 — Version scope — Every source assertion applies to the pinned repositories supporting the named Season 3 build. Flowstate behavior can differ from original retail gameplay. — R0 and script README\n\nOPEN QUESTIONS\nNative bodies behind RunFrame, SendSnapshot, RunCommand, and native respawn calls.\nUnknown SDK layout fields and declarations explicitly marked unconfirmed.\nDirectory-service implementation, its internal persistence, and publication lifecycle.\nExact match/session identity, reconnect ownership, and slot/avatar reuse invariants.\nOriginal retail versus community changes; current EA matchmaking is outside this R5 model.\n\nVALIDATION\nOfficial OntoUML JSON schema validation with format checks\nLossless ontouml-js parse/serialize round trip\nRole/phase identity suppliers and role dependence\nRelators with two mandatory mediated ends\nEvent and intrinsic-aspect relation directions\nSource URLs match the pinned manifest recorded during inspection\nAll four layouts have only horizontal/vertical relation segments\nNo node overlap, relation through a node, or relation-label overlap with a node or another label\nLimitation: Conceptual identities, stereotypes, cardinalities, and session boundaries remain interpretations\nLimitation: Native binary code was not inspected or executed\nLimitation: No full OntoUML semantic or Alloy validation\nLimitation: No graphical editor import test\nLimitation: No directory-service implementation or EA matchmaking inspection","validation":"{\n  \"date\": \"2026-10-06\",\n  \"targetBuild\": \"R5pc_r5launch_N1094_CL456479_2019_10_30_05_20_PM\",\n  \"counts\": {\n    \"classes\": 36,\n    \"valueTypes\": 5,\n    \"relations\": 40,\n    \"generalizations\": 9\n  },\n  \"schema\": \"https://w3id.org/ontouml/schema/v1.0.2\",\n  \"checks\": [\n    \"Official OntoUML JSON schema validation with format checks\",\n         };
        camera.x = (w - b.width * camera.scale) / 2;
        camera.y = (h - b.height * camera.scale) / 2;
        paint();
      }
      function initialCamera() {
        fit();
        if (camera.scale < 0.7) {
          const anchors = (
            current === "runtime"
              ? ["GameServer", "ClientSlot", "GameSession"]
              : ["DirectoryService", "ListingPublication", "ServerListing"]
          ).map((name) => {
            const n = world.querySelector(`[data-name="${name}"]`),
              m = n.transform.baseVal.consolidate().matrix,
              r = n.querySelector("rect");
            return {
              x: m.e,
              y: m.f,
              w: Number(r.getAttribute("width")),
              h: Number(r.getAttribute("height")),
            };
          });
          const x =
              (Math.min(...anchors.map((n) => n.x)) +
                Math.max(...anchors.map((n) => n.x + n.w))) /
              2,
            y =
              (Math.min(...anchors.map((n) => n.y)) +
                Math.max(...anchors.map((n) => n.y + n.h))) /
              2;
          camera = {
            scale: 0.7,
            x: canvas.clientWidth / 2 - x * 0.7,
            y: canvas.clientHeight / 2 - y * 0.7,
            fitted: false,
          };
          paint();
        }
      }
      function zoomTo(
        scale,
        x = canvas.clientWidth / 2,
        y = canvas.clientHeight / 2,
      ) {
        scale = Math.max(0.08, Math.min(3.5, scale));
        const ratio = scale / camera.scale;
        camera.x = x - (x - camera.x) * ratio;
        camera.y = y - (y - camera.y) * ratio;
        camera.scale = scale;
        camera.fitted = false;
        paint();
      }
      function pan(dx, dy) {
        camera.x += dx;
        camera.y += dy;
        camera.fitted = false;
        paint();
      }
      function closePanel() {
        panel.classList.remove("open");
        selected = null;
        world
          .querySelectorAll(".selected")
          .forEach((n) => n.classList.remove("selected"));
      }
      function showView(key, save = true) {
        if (save) cameras[current + ":" + fields] = { ...camera };
        current = key;
        const v = view();
        world.innerHTML = fields ? v.svgFields : v.svg;
        document
          .querySelectorAll("[data-view]")
          .forEach((b) =>
            b.setAttribute("aria-selected", String(b.dataset.view === key)),
          );
        exportLink("#puml-download", EXPORTS.plantUML[key], `r5-${key}.puml`);
        if (svgURL) URL.revokeObjectURL(svgURL);
        svgURL = URL.createObjectURL(
          new Blob([fields ? v.svgFields : v.svg], { type: "image/svg+xml" }),
        );
        $("#svg-download").href = svgURL;
        $("#svg-download").download = `r5-${key}${fields ? "-fields" : ""}.svg`;
        closePanel();
        if (cameras[key + ":" + fields]) {
          camera = { ...cameras[key + ":" + fields] };
          paint();
        } else initialCamera();
      }
      function inspect(name) {
        const c = MODEL.classes.find((c) => c.name === name);
        if (!c) return;
        selected = name;
        world
          .querySelectorAll(".node")
          .forEach((n) =>
            n.classList.toggle("selected", n.dataset.name === name),
          );
        content.innerHTML = `<span class="tag">«${E(c.stereo)}»</span><h1>${E(c.name)}</h1><p>${E(c.description)}</p>${c.attrs.length ? "<h2>Fields</h2>" + c.attrs.map(([a, t, k]) => `<div class="field-row"><span>${E(a)}</span><span>${E(t)}${k ? " [" + E(k) + "]" : ""}</span></div>`).join("") : ""}<h2>Source</h2>${c.evidence
          .map((id) => {
            const s = MODEL.sources.find((s) => s.id === id);
            return `<a class="source" href="${E(s.url)}" target="_blank" rel="noopener">${E(s.title)} ↗</a>`;
          })
          .join(
            "",
          )}<p class="muted">OntoUML classification and multiplicities are interpretations.</p>`;
        panel.classList.add("open");
      }
      function focusConcept(name) {
        const c = MODEL.classes.find((c) => c.name === name);
        if (!c) return;
        if (!view().names.includes(name))
          showView(c.pkg === "backend" ? "backend" : "runtime");
        const n = world.querySelector(`[data-name="${name}"]`),
          m = n.transform.baseVal.consolidate().matrix,
          r = n.querySelector("rect"),
          freeWidth =
            canvas.clientWidth > 620
              ? canvas.clientWidth - 338
              : canvas.clientWidth;
        camera.scale = Math.max(camera.scale, 0.85);
        camera.x =
          freeWidth / 2 -
          (m.e + Number(r.getAttribute("width")) / 2) * camera.scale;
        camera.y =
          canvas.clientHeight / 2 -
          (m.f + Number(r.getAttribute("height")) / 2) * camera.scale;
        camera.fitted = false;
        paint();
        inspect(name);
        $("#suggestions").classList.remove("open");
        $("#search").value = "";
        $("#search").blur();
        $(".search").classList.remove("open");
      }
      function about() {
        closePanel();
        content.innerHTML = `<span class="tag">R5Reloaded · Apex Season 3</span><h1>OntoUML</h1><p>Scroll with two fingers to pan. Pinch to zoom. Drag to pan. Select a concept for fields and source.</p><p><kbd>+</kbd> / <kbd>−</kbd> zoom · <kbd>0</kbd> fit · <kbd>Esc</kbd> close</p><h2>Types</h2>${Object.entries(
          {
            kind: "#edf4ff",
            role: "#fff3da",
            relator: "#f3eaff",
            phase: "#eaf8f0",
            event: "#fff0ed",
            mode: "#eaf7fa",
          },
        )
          .map(
            ([s, c]) =>
              `<div class="legend-row"><span class="swatch" style="background:${c}"></span>«${s}»</div>`,
          )
          .join(
            "",
          )}<h2>Evidence</h2><p>Public SDK and scripts were inspected at pinned commits. Native engine bodies remain partly opaque.</p><a class="source" href="https://github.com/Mauler125/r5sdk/tree/${MODEL.repositories[0].commit}" target="_blank" rel="noopener">R5 SDK ↗</a><a class="source" href="https://github.com/Mauler125/r5_flowstate/tree/${MODEL.repositories[1].commit}" target="_blank" rel="noopener">Flowstate scripts ↗</a><a id="notes-download" class="source" href="downloads/r5-model-notes.txt" download>Source notes ↓</a><a id="validation-download" class="source" href="downloads/r5-validation.json" download>Validation report ↓</a><p class="muted">JSON schema and structural checks pass. Full OntoUML semantics and editor import remain untested.</p>`;
        panel.classList.add("open");
        exportLink("#notes-download", EXPORTS.notes, "r5-model-notes.txt");
        exportLink(
          "#validation-download",
          EXPORTS.validation,
          "r5-validation.json",
          "application/json",
        );
      }
      document
        .querySelectorAll("[data-view]")
        .forEach((b) => (b.onclick = () => showView(b.dataset.view)));
      $("#zoom-in").onclick = () => zoomTo(camera.scale * 1.25);
      $("#zoom-out").onclick = () => zoomTo(camera.scale / 1.25);
      $("#zoom-value").onclick = () => zoomTo(1);
      $("#fit").onclick = fit;
      $("#info").onclick = about;
      $(".panel-close").onclick = closePanel;
      $("#fields").onclick = () => {
        cameras[current + ":" + fields] = { ...camera };
        fields = !fields;
        $("#fields").setAttribute("aria-pressed", String(fields));
        showView(current, false);
      };
      $("#export").onclick = () => {
        const open = $("#export-menu").classList.toggle("open");
        $("#export").setAttribute("aria-expanded", String(open));
      };
      $("#search-toggle").onclick = () => {
        const open = $(".search").classList.toggle("open");
        if (open) $("#search").focus();
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu-wrap")) {
          $("#export-menu").classList.remove("open");
          $("#export").setAttribute("aria-expanded", "false");
        }
        if (!e.target.closest(".search") && e.target.id !== "search-toggle") {
          $("#suggestions").classList.remove("open");
          $(".search").classList.remove("open");
        }
      });
      $("#search").addEventListener("input", () => {
        const q = $("#search").value.trim().toLowerCase();
        const hits = q
          ? MODEL.classes
              .filter((c) => c.name.toLowerCase().includes(q))
              .slice(0, 12)
          : [];
        $("#suggestions").replaceChildren(
          ...hits.map((c) => {
            const b = document.createElement("button");
            b.textContent = c.name;
            b.setAttribute("role", "option");
            b.onclick = () => focusConcept(c.name);
            return b;
          }),
        );
        $("#suggestions").classList.toggle("open", !!hits.length);
      });
      $("#search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          $("#suggestions button")?.click();
          e.preventDefault();
        }
        if (e.key === "ArrowDown") {
          $("#suggestions button")?.focus();
          e.preventDefault();
        }
        if (e.key === "Escape") {
          $("#suggestions").classList.remove("open");
          $(".search").classList.remove("open");
          $("#search").blur();
        }
      });
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const unit =
              e.deltaMode === 1
                ? 16
                : e.deltaMode === 2
                  ? canvas.clientHeight
                  : 1,
            rect = canvas.getBoundingClientRect();
          if (e.ctrlKey || e.metaKey)
            zoomTo(
              camera.scale * Math.exp(-e.deltaY * unit * 0.01),
              e.clientX - rect.left,
              e.clientY - rect.top,
            );
          else pan(-e.deltaX * unit, -e.deltaY * unit);
        },
        { passive: false },
      );
      function gesture() {
        const p = [...pointers.values()];
        if (p.length < 2) return null;
        return {
          x: (p[0].x + p[1].x) / 2,
          y: (p[0].y + p[1].y) / 2,
          d: Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y),
        };
      }
      canvas.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        const rect = canvas.getBoundingClientRect(),
          p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        pointers.set(e.pointerId, p);
        canvas.setPointerCapture(e.pointerId);
        drag = {
          startX: p.x,
          startY: p.y,
          lastX: p.x,
          lastY: p.y,
          moved: false,
          target: e.target.closest(".node")?.dataset.name,
          gesture: gesture(),
        };
        canvas.classList.add("dragging");
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId) || !drag) return;
        const rect = canvas.getBoundingClientRect(),
          p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        pointers.set(e.pointerId, p);
        const g = gesture();
        if (g && drag.gesture) {
          const old = drag.gesture;
          pan(g.x - old.x, g.y - old.y);
          if (old.d > 0) zoomTo((camera.scale * g.d) / old.d, g.x, g.y);
          drag.moved = true;
          drag.gesture = g;
        } else if (g) drag.gesture = g;
        else {
          if (Math.hypot(p.x - drag.startX, p.y - drag.startY) > 4)
            drag.moved = true;
          if (drag.moved) pan(p.x - drag.lastX, p.y - drag.lastY);
          drag.lastX = p.x;
          drag.lastY = p.y;
        }
      });
      function pointerEnd(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (drag?.moved) suppressClick = true;
        if (!pointers.size) {
          if (drag && !drag.moved && drag.target) inspect(drag.target);
          drag = null;
          canvas.classList.remove("dragging");
          setTimeout(() => (suppressClick = false), 0);
        } else {
          const p = [...pointers.values()][0];
          drag = {
            startX: p.x,
            startY: p.y,
            lastX: p.x,
            lastY: p.y,
            moved: true,
            gesture: gesture(),
          };
        }
      }
      canvas.addEventListener("pointerup", pointerEnd);
      canvas.addEventListener("pointercancel", pointerEnd);
      canvas.addEventListener("click", (e) => {
        if (suppressClick) e.stopPropagation();
      });
      world.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target.closest(".node")) {
          e.preventDefault();
          inspect(e.target.closest(".node").dataset.name);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input")) return;
        if (e.key === "+" || e.key === "=") {
          zoomTo(camera.scale * 1.25);
          e.preventDefault();
        }
        if (e.key === "-") {
          zoomTo(camera.scale / 1.25);
          e.preventDefault();
        }
        if (e.key === "0") {
          fit();
          e.preventDefault();
        }
        if (e.key === "Escape") {
          closePanel();
          $("#export-menu").classList.remove("open");
          $("#suggestions").classList.remove("open");
        }
      });
      let safariStart = 1;
      canvas.addEventListener(
        "gesturestart",
        (e) => {
          e.preventDefault();
          safariStart = camera.scale;
        },
        { passive: false },
      );
      canvas.addEventListener(
        "gesturechange",
        (e) => {
          e.preventDefault();
          const r = canvas.getBoundingClientRect();
          zoomTo(safariStart * e.scale, e.clientX - r.left, e.clientY - r.top);
        },
        { passive: false },
      );
      canvas.addEventListener("gestureend", (e) => e.preventDefault(), {
        passive: false,
      });
      let canvasSize = {
        width: canvas.clientWidth,
        height: canvas.clientHeight,
      };
      new ResizeObserver(() => {
        const width = canvas.clientWidth,
          height = canvas.clientHeight;
        if (width !== canvasSize.width || height !== canvasSize.height) {
          if (camera.fitted) fit();
          else
            pan(
              (width - canvasSize.width) / 2,
              (height - canvasSize.height) / 2,
            );
          canvasSize = { width, height };
        }
      }).observe(canvas);
      exportLink(
        "#model-download",
        EXPORTS.schema,
        "r5-ontouml.json",
        "application/json",
      );
      exportLink(
        "#bundle-download",
        Uint8Array.from(atob(EXPORTS.bundle), (c) => c.charCodeAt(0)),
        "r5-models.zip",
        "application/zip",
      );
      showView("runtime", false);
    </script>
  </body>
</html>
