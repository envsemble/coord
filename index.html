<!doctype html>
<html lang="en" data-theme="dark">
  <head>

    <title>R5Reloaded / Apex Season 3 | OntoUML Atlas</title>
    <style>
      :root {
  color-scheme: dark;
  --canvas: #22272e;
  --surface: #2d333b;
  --text: #cdd9e5;
  --muted: #909dab;
  --border: #444c56;
  --hover: #373e47;
  --focus: #539bf5;
  --selected-bg: #4184e426;
  --selected-text: #cdd9e5;
  --link: #6cb6ff;
  --grid: #373e47;
  --accent: #6cb6ff;
  --shadow: #1c212866;
  --tab-indicator: #ec775c;
  --inspector-width: clamp(440px, 42vw, 640px);
}
:root[data-theme="light"] {
  color-scheme: light;
  --canvas: #ffffff;
  --surface: #ffffff;
  --text: #1f2328;
  --muted: #59636e;
  --border: #d1d9e0;
  --hover: #f0f2f5;
  --focus: #0969da;
  --selected-bg: #0969da1a;
  --selected-text: #1f2328;
  --link: #0969da;
  --grid: #d1d9e0;
  --accent: #0969da;
  --shadow: #1f23281f;
  --tab-indicator: #fd8c73;
}

:root {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    Segoe UI,
    "Noto Sans",
    Helvetica,
    Arial,
    sans-serif;
  color: var(--text);
  background: var(--canvas);
  font-size: 13px;
}
* {
  box-sizing: border-box;
  scrollbar-color: var(--border) var(--surface);
  scrollbar-width: thin;
}
body {
  margin: 0;
  overflow: hidden;
}
button,
input,
a {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  background: transparent;
  border: 0;
  border-radius: 6px;
  height: 32px;
  padding: 0 11px;
  white-space: nowrap;
}
button:hover {
  background: var(--hover);
}
button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
button[aria-pressed="true"],
button[aria-selected="true"] {
  background: var(--selected-bg);
  color: var(--selected-text);
}
header {
  position: relative;
  z-index: 10;
  height: 50px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand {
  font-weight: 650;
  letter-spacing: 0.03em;
  color: var(--text);
  margin-right: 3px;
}
.tabs {
  display: flex;
  gap: 3px;
}
.tabs button {
  position: relative;
  font-weight: 500;
}
.tabs button[aria-selected="true"] {
  background: var(--hover);
  color: var(--text);
  font-weight: 600;
}
.tabs button[aria-selected="true"]::after {
  content: "";
  position: absolute;
  inset: auto 3px -9px;
  height: 2px;
  border-radius: 2px;
  background: var(--tab-indicator);
}
.spacer {
  flex: 1;
}
.search {
  position: relative;
  width: 190px;
}
.search input {
  width: 100%;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--canvas);
  padding: 0 10px;
  color: inherit;
}
.suggestions {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  top: 36px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 7px 25px var(--shadow);
  border-radius: 8px;
  max-height: 280px;
  overflow: auto;
}
.suggestions.open {
  display: block;
}
.suggestions button {
  display: block;
  text-align: left;
  width: 100%;
  padding: 0 8px;
  font-size: 12px;
}
.camera-controls {
  display: flex;
  align-items: center;
  gap: 2px;
  border-left: 1px solid var(--border);
  padding-left: 8px;
}
.icon {
  padding: 0;
  width: 30px;
  font-size: 18px;
}
.zoom-readout {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  min-width: 50px;
  padding: 0 6px;
}
.fields {
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--hover);
  font-weight: 500;
}
.divider {
  height: 20px;
  width: 1px;
  background: var(--border);
}
.menu-wrap {
  position: relative;
}
.menu {
  display: none;
  position: absolute;
  right: 0;
  top: 38px;
  min-width: 190px;
  padding: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 7px 25px var(--shadow);
}
.menu.open {
  display: block;
}
.menu a {
  display: block;
  padding: 9px 10px;
  border-radius: 4px;
  text-decoration: none;
  color: var(--link);
}
.menu a:hover {
  background: var(--hover);
}
.panel {
  display: none;
  position: fixed;
  z-index: 9;
  right: 14px;
  top: 64px;
  width: 360px;
  max-height: calc(100vh - 80px);
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  box-shadow: 0 8px 32px var(--shadow);
  padding: 16px;
  user-select: text;
}
.panel.open {
  display: block;
}
.panel-close {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 20px;
}
.panel h1 {
  font-size: 16px;
  line-height: 1.3;
  margin: 8px 0 12px;
  overflow-wrap: anywhere;
}
.tag {
  font-size: 11px;
  color: var(--muted);
  display: inline-block;
  padding: 2px 7px;
  border: 1px solid var(--border);
  border-radius: 20px;
}
.panel p {
  font-size: 12px;
  line-height: 1.65;
  margin: 10px 0;
}
.panel h2 {
  font-size: 11px;
  font-weight: 650;
  letter-spacing: normal;
  color: var(--muted);
  margin: 16px 0 8px;
}
.panel a {
  color: var(--link);
  text-decoration: none;
}
.panel a:hover {
  text-decoration: underline;
}
.source {
  display: block;
  font-size: 12px;
  margin: 10px 0;
  line-height: 1.5;
}
.field-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
}
.field-row span:last-child {
  color: var(--muted);
  text-align: right;
}
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 9px 0;
  font-size: 12px;
}
.swatch {
  width: 15px;
  height: 15px;
  border: 1px solid var(--diagram-border);
  border-radius: 3px;
}
.panel kbd {
  font: 11px inherit;
  background: var(--hover);
  padding: 2px 5px;
  border-radius: 3px;
}
.muted {
  color: var(--muted);
}
@media (max-width: 900px) {
  header {
    gap: 6px;
    padding: 0 8px;
  }
  .brand {
    display: none;
  }
  .search {
    width: 150px;
  }
  .camera-controls {
    padding-left: 4px;
  }
  .fields {
    padding: 0 7px;
  }
}
@media (max-width: 680px) {
  .search {
    display: none;
  }
  .tabs button {
    font-size: 12px;
    padding: 0 8px;
  }
  .zoom-readout {
    min-width: 43px;
  }
  .camera-controls {
    gap: 0;
  }
  .panel {
    right: 8px;
    width: min(360px, calc(100vw - 16px));
  }
  header {
    gap: 4px;
  }
}
#search-toggle {
  display: none;
}
@media (max-width: 680px) {
  #search-toggle {
    display: block;
  }
  .search {
    position: absolute;
    right: 160px;
    top: 58px;
    width: 230px;
    background: var(--surface);
    padding: 7px;
    border-radius: 8px;
    box-shadow: 0 7px 25px var(--shadow);
  }
  .search.open {
    display: block;
  }
  .search .suggestions {
    top: 42px;
  }
}

input::placeholder {
  color: var(--muted);
}

.relation-end {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.relation-end button {
  padding: 0;
  color: var(--link);
  text-align: left;
  height: auto;
  min-height: 28px;
  overflow-wrap: anywhere;
  white-space: normal;
}
.count-badge {
  flex: none;
  padding: 3px 8px;
  border: 1px solid var(--diagram-border);
  border-radius: 5px;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  color: var(--text);
}
.about-panel {
  right: auto;
  left: 14px;
}
.inspector {
  top: 50px;
  right: 0;
  width: var(--inspector-width);
  height: calc(100dvh - 50px);
  max-height: none;
  border: 0;
  border-left: 1px solid var(--border);
  border-radius: 0;
  padding: 24px;
  box-shadow: none;
}
.viewer.inspecting #canvas {
  right: var(--inspector-width);
}
.inspector h1 {
  font-size: 20px;
}
.inspector p {
  font-size: 13px;
}
.inspector .code-snippet {
  font-size: 12px;
}
@media (max-width: 900px) {
  :root {
    --inspector-width: 400px;
  }
  .inspector {
    padding: 18px;
  }
}
@media (max-width: 680px) {
  .inspector {
    width: min(440px, 100vw);
  }
  .viewer.inspecting #canvas {
    right: 0;
  }
}
.source-path {
  padding: 7px 10px;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: 0;
  border-radius: 6px 6px 0 0;
}
.code-snippet {
  margin: 0;
  padding: 10px 0;
  border: 1px solid var(--border);
  border-radius: 0 0 6px 6px;
  background: var(--canvas);
  color: var(--text);
  overflow: auto;
  font:
    11px/1.65 ui-monospace,
    SFMono-Regular,
    SF Mono,
    Menlo,
    Consolas,
    "Liberation Mono",
    monospace;
  tab-size: 2;
}
.code-snippet:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.code-line::before {
  content: attr(data-line);
  display: inline-block;
  position: sticky;
  left: 0;
  width: 40px;
  padding: 0 10px;
  margin-right: 8px;
  color: var(--muted);
  background: var(--canvas);
  text-align: right;
  user-select: none;
}
.shiki .code-line > span {
  color: var(--shiki-dark);
  font-style: var(--shiki-dark-font-style);
  font-weight: var(--shiki-dark-font-weight);
}
:root[data-theme="light"] .shiki .code-line > span {
  color: var(--shiki-light);
  font-style: var(--shiki-light-font-style);
  font-weight: var(--shiki-light-font-weight);
}
.source-github {
  display: inline-block;
  font-size: 11px;
  margin-top: 8px;
}
.additional-source,
.concept-fields {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.panel summary {
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}
.panel summary:hover {
  color: var(--text);
}
.additional-source .source-excerpt {
  margin-top: 10px;
}
.evidence-status {
  margin-left: 6px;
}
.learning-tabs {
  display: flex;
  gap: 4px;
  margin: 16px 0;
}
.learning-search {
  width: 100%;
  padding: 8px 10px;
  color: var(--text);
  background: var(--canvas);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 12px;
}
.learn-concept,
.finding {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: 12px;
}
.learn-concept summary,
.finding summary {
  line-height: 1.6;
  color: var(--text);
}
.finding summary {
  color: var(--diagram-selection);
}
.learning-question {
  border-left: 2px solid var(--link);
  padding-left: 12px;
}
.lesson .source {
  margin-bottom: 14px;
}
.validation-count {
  display: inline-block;
  font-size: 11px;
  border-radius: 12px;
  padding: 1px 6px;
  margin-left: 6px;
  color: var(--diagram-selection);
  background: var(--hover);
}
.validation-issue {
  border-top: 1px solid var(--border);
  padding: 14px 0;
}
.validation-issue.info {
  opacity: 0.8;
}
.issue-link {
  color: var(--link);
  padding: 0;
}
.answer-button {
  border: 1px solid var(--border);
}
.open-question {
  border-left: 2px solid var(--border);
  padding-left: 12px;
}
.viewer-error {
  max-width: 520px;
  margin: 15vh auto;
  padding: 24px;
}
@media (max-width: 680px) {
  .learn-toggle {
    padding: 0 6px;
  }
  .learning-tabs {
    flex-wrap: wrap;
  }
}

@media (prefers-reduced-motion: reduce) {
  .diagram-element {
    transition: none;
  }
}

:root {
  --diagram-border: #768390;
  --diagram-divider: #636e7b;
  --diagram-edge: #909dab;
  --diagram-inheritance: #adbac7;
  --diagram-label: #cdd9e5;
  --diagram-muted: #909dab;
  --diagram-attribute: #adbac7;
  --diagram-selection: #eac55f;
  --node-kind: #273e54;
  --node-role: #49382c;
  --node-relator: #403452;
  --node-phase: #2a4437;
  --node-event: #4d3236;
  --node-mode: #29434b;
  --type-kind: #6cb6ff;
  --type-role: #f69d50;
  --type-relator: #dcbdfb;
  --type-phase: #8ddb8c;
  --type-event: #ff938a;
  --type-mode: #76e3ea;
}
:root[data-theme="light"] {
  --diagram-border: #818b98;
  --diagram-divider: #d1d9e0;
  --diagram-edge: #59636e;
  --diagram-inheritance: #59636e;
  --diagram-label: #1f2328;
  --diagram-muted: #59636e;
  --diagram-attribute: #59636e;
  --diagram-selection: #9a6700;
  --node-kind: #ddedff;
  --node-role: #fff0df;
  --node-relator: #f0e5ff;
  --node-phase: #e1f2e4;
  --node-event: #ffe5e2;
  --node-mode: #e0f3f5;
  --type-kind: #0550ae;
  --type-role: #953800;
  --type-relator: #8250df;
  --type-phase: #116329;
  --type-event: #cf222e;
  --type-mode: #0a3069;
}
#canvas {
  position: fixed;
  inset: 50px 0 0;
  overflow: hidden;
  touch-action: none;
  overscroll-behavior: none;
  cursor: grab;
  background-color: var(--canvas);
  user-select: none;
}
.canvas-grid {
  position: absolute;
  inset: -64px;
  pointer-events: none;
  background-image: radial-gradient(var(--grid) 0.7px, transparent 0.7px);
  background-size: 20px 20px;
  will-change: transform;
}
#canvas.dragging {
  cursor: grabbing;
}
#world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}
#world svg {
  display: block;
  overflow: visible;
}
.node {
  cursor: pointer;
  outline: none;
}
.node:hover .node-box,
.node:focus-visible .node-box {
  stroke: var(--accent);
  stroke-width: 2;
}
.diagram-element {
  transition: opacity 130ms ease;
}
.node.dimmed,
.edge.dimmed {
  opacity: 0.22;
}
.node.highlighted .node-box {
  stroke: var(--accent);
  stroke-width: 2;
}
.node.primary .node-box {
  stroke: var(--diagram-selection);
  stroke-width: 3;
}
.edge {
  outline: none;
  cursor: pointer;
}
.edge.highlighted .edge-path,
.edge:focus-visible .edge-path {
  stroke: var(--accent);
  stroke-width: 2.5;
}
.edge.highlighted .multiplicity rect {
  stroke: var(--accent);
  stroke-width: 1.4;
}
.edge.highlighted .edge-label text {
  fill: var(--accent);
}
.edge-label {
  pointer-events: all;
}
@media (prefers-reduced-motion: reduce) {
  .diagram-element {
    transition: none;
  }
}
