image: node:22
stages:
  - verify
verify:
  stage: verify
  script:
    - npm ci
    - npm run format:check
    - npm run check:types
    - npm test
    - npm run check
    - npm run check:package
    - git diff --exit-code -- index.html downloads dist
  artifacts:
    paths:
      - index.html
      - downloads/
    expire_in: 1 week
