<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>R5 · OntoUML</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #10151f;
        --surface: #18202d;
        --text: #e0e7f3;
        --muted: #9caac0;
        --border: #303d52;
        --hover: #243247;
        --focus: #a8bfff;
        --selected-bg: #263f66;
        --selected-text: #c1d8ff;
        --link: #92b8ff;
        --grid: #29364c;
        --accent: #9dbbff;
        --shadow: #00000040;
        --diagram-border: #657b99;
        --diagram-divider: #46566e;
        --diagram-edge: #8395b0;
        --diagram-inheritance: #a2b4cf;
        --diagram-label: #bdcade;
        --diagram-muted: #9faec5;
        --diagram-attribute: #c8d4e7;
        --node-kind: #1b304b;
        --node-role: #423623;
        --node-relator: #342943;
        --node-phase: #203c31;
        --node-event: #432b2d;
        --node-mode: #203842;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --canvas: #fafbfe;
        --surface: #ffffff;
        --text: #26354c;
        --muted: #627088;
        --border: #e2e7ef;
        --hover: #edf0f6;
        --focus: #5876db;
        --selected-bg: #e7edfc;
        --selected-text: #3655a3;
        --link: #496baf;
        --grid: #d9e0eb;
        --accent: #486bd0;
        --shadow: #24344c15;
        --diagram-border: #72839d;
        --diagram-divider: #b7c2d2;
        --diagram-edge: #77859a;
        --diagram-inheritance: #57667e;
        --diagram-label: #42516a;
        --diagram-muted: #5b687f;
        --diagram-attribute: #44546c;
        --node-kind: #edf4ff;
        --node-role: #fff3da;
        --node-relator: #f3eaff;
        --node-phase: #eaf8f0;
        --node-event: #fff0ed;
        --node-mode: #eaf7fa;
      }

      :root {
        font-family:
          Inter,
          Segoe UI,
          Arial,
          sans-serif;
        color: var(--text);
        background: var(--canvas);
        font-size: 13px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      button,
      input,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 6px;
        height: 32px;
        padding: 0 11px;
        white-space: nowrap;
      }
      button:hover {
        background: var(--hover);
      }
      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      button[aria-pressed="true"],
      button[aria-selected="true"] {
        background: var(--selected-bg);
        color: var(--selected-text);
      }
      header {
        position: relative;
        z-index: 10;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 650;
        letter-spacing: 0.03em;
        color: var(--muted);
        margin-right: 3px;
      }
      .tabs {
        display: flex;
        gap: 3px;
      }
      .spacer {
        flex: 1;
      }
      .search {
        position: relative;
        width: 190px;
      }
      .search input {
        width: 100%;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--canvas);
        padding: 0 10px;
        color: inherit;
      }
      .suggestions {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 36px;
        padding: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 7px 25px var(--shadow);
        border-radius: 8px;
        max-height: 280px;
        overflow: auto;
      }
      .suggestions.open {
        display: block;
      }
      .suggestions button {
        display: block;
        text-align: left;
        width: 100%;
        padding: 0 8px;
        font-size: 12px;
      }
      .camera-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        border-left: 1px solid var(--border);
        padding-left: 8px;
      }
      .icon {
        padding: 0;
        width: 30px;
        font-size: 18px;
      }
      .zoom-readout {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        min-width: 50px;
        padding: 0 6px;
      }
      .fields {
        font-size: 12px;
      }
      .divider {
        height: 20px;
        width: 1px;
        background: var(--border);
      }
      .menu-wrap {
        position: relative;
      }
      .menu {
        display: none;
        position: absolute;
        right: 0;
        top: 38px;
        min-width: 190px;
        padding: 5px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 7px 25px var(--shadow);
      }
      .menu.open {
        display: block;
      }
      .menu a {
        display: block;
        padding: 9px 10px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--link);
      }
      .menu a:hover {
        background: var(--hover);
      }
      #canvas {
        position: fixed;
        inset: 50px 0 0;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        cursor: grab;
        background-color: var(--canvas);
        background-image: radial-gradient(var(--grid) 0.7px, transparent 0.7px);
        background-size: 20px 20px;
        user-select: none;
      }
      #canvas.dragging {
        cursor: grabbing;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      #world svg {
        display: block;
        overflow: visible;
      }
      .node {
        cursor: pointer;
        outline: none;
      }
      .node:hover .node-box,
      .node:focus-visible .node-box {
        stroke: var(--accent);
        stroke-width: 2;
      }
      .node.selected .node-box {
        stroke: var(--accent);
        stroke-width: 2.5;
      }
      .node.dimmed {
        opacity: 0.27;
      }
      .edge-label {
        pointer-events: none;
      }
      .panel {
        display: none;
        position: fixed;
        z-index: 9;
        right: 14px;
        top: 64px;
        width: 310px;
        max-height: calc(100vh - 80px);
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 8px 32px var(--shadow);
        padding: 18px;
        user-select: text;
      }
      .panel.open {
        display: block;
      }
      .panel-close {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 20px;
      }
      .panel h1 {
        font-size: 17px;
        line-height: 1.3;
        margin: 9px 20px 14px 0;
        overflow-wrap: anywhere;
      }
      .tag {
        font-size: 11px;
        color: var(--muted);
      }
      .panel p {
        font-size: 12px;
        line-height: 1.65;
        margin: 10px 0;
      }
      .panel h2 {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 22px 0 9px;
      }
      .panel a {
        color: var(--link);
        text-decoration: none;
      }
      .panel a:hover {
        text-decoration: underline;
      }
      .source {
        display: block;
        font-size: 12px;
        margin: 10px 0;
        line-height: 1.5;
      }
      .field-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        font-size: 11px;
        border-bottom: 1px solid var(--border);
      }
      .field-row span:last-child {
        color: var(--muted);
        text-align: right;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 9px 0;
        font-size: 12px;
      }
      .swatch {
        width: 15px;
        height: 15px;
        border: 1px solid var(--diagram-border);
        border-radius: 3px;
      }
      .panel kbd {
        font: 11px inherit;
        background: var(--hover);
        padding: 2px 5px;
        border-radius: 3px;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 900px) {
        header {
          gap: 6px;
          padding: 0 8px;
        }
        .brand {
          display: none;
        }
        .search {
          width: 150px;
        }
        .camera-controls {
          padding-left: 4px;
        }
        .fields {
          padding: 0 7px;
        }
      }
      @media (max-width: 680px) {
        .search {
          display: none;
        }
        .tabs button {
          font-size: 12px;
          padding: 0 8px;
        }
        .zoom-readout {
          min-width: 43px;
        }
        .camera-controls {
          gap: 0;
        }
        .panel {
          right: 8px;
          width: min(310px, calc(100vw - 16px));
        }
        header {
          gap: 4px;
        }
      }
      #search-toggle {
        display: none;
      }
      @media (max-width: 680px) {
        #search-toggle {
          display: block;
        }
        .search {
          position: absolute;
          right: 160px;
          top: 58px;
          width: 230px;
          background: var(--surface);
          padding: 7px;
          border-radius: 8px;
          box-shadow: 0 7px 25px var(--shadow);
        }
        .search.open {
          display: block;
        }
        .search .suggestions {
          top: 42px;
        }
      }

      input::placeholder {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand" title="R5Reloaded · Apex Season 3">R5 · S3</span>
      <nav class="tabs" aria-label="Diagram">
        <button data-view="runtime" aria-selected="true">Game server</button
        ><button data-view="backend" aria-selected="false">
          Server browser
        </button>
      </nav>
      <span class="spacer"></span>
      <button
        id="search-toggle"
        class="icon"
        aria-label="Open concept search"
        title="Find concept"
      >
        ⌕
      </button>
      <div class="search">
        <input
          id="search"
          type="search"
          placeholder="Find concept…"
          aria-label="Find concept"
          autocomplete="off"
        />
        <div
          id="suggestions"
          class="suggestions"
          role="listbox"
          aria-label="Concepts"
        ></div>
      </div>
      <button
        id="fields"
        class="fields"
        aria-pressed="false"
        title="Show attributes in the diagram"
      >
        Fields
      </button>
      <div class="camera-controls">
        <button
          id="zoom-out"
          class="icon"
          aria-label="Zoom out"
          title="Zoom out (−)"
        >
          −</button
        ><button id="zoom-value" class="zoom-readout" title="Reset to 100%">
          100%</button
        ><button
          id="zoom-in"
          class="icon"
          aria-label="Zoom in"
          title="Zoom in (+)"
        >
          +</button
        ><button id="fit" title="Fit diagram (0)">Fit</button>
      </div>
      <span class="divider"></span>
      <button
        id="theme-toggle"
        class="icon"
        aria-label="Switch to light theme"
        title="Switch to light theme"
      >
        ☀
      </button>
      <div class="menu-wrap">
        <button
          id="export"
          class="icon"
          aria-label="Export"
          aria-expanded="false"
          title="Export"
        >
          ↓
        </button>
        <div id="export-menu" class="menu">
          <a id="svg-download" href="downloads/r5-runtime.svg" download
            >Diagram · SVG</a
          ><a id="puml-download" href="downloads/r5-runtime.puml" download
            >Diagram · PlantUML</a
          ><a id="model-download" href="downloads/r5-ontouml.json" download
            >Model · OntoUML JSON</a
          ><a id="bundle-download" href="downloads/r5-models.zip" download
            >Models · ZIP</a
          >
        </div>
      </div>
      <button
        id="info"
        class="icon"
        aria-label="About and controls"
        title="About and controls"
      >
        ⓘ
      </button>
    </header>
    <main id="canvas" aria-label="Interactive OntoUML diagram">
      <div id="world"></div>
    </main>
    <aside id="panel" class="panel" aria-label="Diagram details">
      <button class="panel-close" aria-label="Close details">×</button>
      <div id="panel-content"></div>
    </aside>
    <script>
      /*MODEL_DATA*/
      const $ = (s) => document.querySelector(s),
        E = (s) =>
          String(s)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
      const canvas = $("#canvas"),
        world = $("#world"),
        panel = $("#panel"),
        content = $("#panel-content");
      let current = "runtime",
        fields = false,
        selected = null,
        camera = { x: 0, y: 0, scale: 1, fitted: true },
        cameras = {},
        drag = null,
        suppressClick = false,
        svgURL = null;
      const THEME_KEY = "r5-ontouml-theme";
      const THEME_VARS = [
        "--canvas",
        "--text",
        "--diagram-border",
        "--diagram-divider",
        "--diagram-edge",
        "--diagram-inheritance",
        "--diagram-label",
        "--diagram-muted",
        "--diagram-attribute",
        "--node-kind",
        "--node-role",
        "--node-relator",
        "--node-phase",
        "--node-event",
        "--node-mode",
      ];
      let theme = "dark";
      function loadTheme() {
        try {
          const saved = localStorage.getItem(THEME_KEY);
          return saved === "light" || saved === "dark" ? saved : "dark";
        } catch {
          return "dark";
        }
      }
      function setTheme(value, save = true) {
        theme = value === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        const button = document.querySelector("#theme-toggle");
        const label =
          theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
        button.textContent = theme === "dark" ? "☀" : "☾";
        button.setAttribute("aria-label", label);
        button.title = label;
        if (save) {
          try {
            localStorage.setItem(THEME_KEY, theme);
          } catch {}
        }
        if (world.querySelector("svg")) updateSVGExport();
      }
      function updateSVGExport() {
        const svg = world.querySelector("svg").cloneNode(true),
          styles = getComputedStyle(document.documentElement);
        for (const name of THEME_VARS)
          svg.style.setProperty(name, styles.getPropertyValue(name).trim());
        svg
          .querySelectorAll(".selected,.dimmed")
          .forEach((n) => n.classList.remove("selected", "dimmed"));
        const background = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect",
        );
        background.setAttribute("width", svg.viewBox.baseVal.width);
        background.setAttribute("height", svg.viewBox.baseVal.height);
        background.setAttribute(
          "fill",
          styles.getPropertyValue("--canvas").trim(),
        );
        svg.insertBefore(background, svg.firstChild);
        if (svgURL) URL.revokeObjectURL(svgURL);
        svgURL = URL.createObjectURL(
          new Blob([new XMLSerializer().serializeToString(svg)], {
            type: "image/svg+xml",
          }),
        );
        document.querySelector("#svg-download").href = svgURL;
        document.querySelector("#svg-download").download =
          `r5-${current}${fields ? "-fields" : ""}-${theme}.svg`;
      }
      const pointers = new Map(),
        exportURLs = new Map();
      function exportLink(
        selector,
        data,
        filename,
        type = "text/plain;charset=utf-8",
      ) {
        if (!exportURLs.has(filename))
          exportURLs.set(
            filename,
            URL.createObjectURL(new Blob([data], { type })),
          );
        const link = document.querySelector(selector);
        link.href = exportURLs.get(filename);
        link.download = filename;
      }
      const view = () => VIEWS.find((v) => v.key === current);
      const bounds = () => world.querySelector("svg").viewBox.baseVal;
      const PINCH_WHEEL_SENSITIVITY = 0.0015,
        PINCH_GESTURE_SENSITIVITY = 0.15,
        PINCH_EASING_MS = 80;
      let pinchZoom = null,
        pinchFrame = null;
      const clampScale = (scale) => Math.max(0.08, Math.min(3.5, scale));
      function cancelPinchZoom() {
        if (pinchFrame !== null) cancelAnimationFrame(pinchFrame);
        pinchFrame = null;
        pinchZoom = null;
      }
      function paint() {
        world.style.transform = `translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;
        $("#zoom-value").textContent = Math.round(camera.scale * 100) + "%";
        canvas.style.backgroundPosition = `${camera.x}px ${camera.y}px`;
      }
      function fit() {
        cancelPinchZoom();
        const b = bounds(),
          w = canvas.clientWidth,
          h = canvas.clientHeight;
        camera = {
          x: 0,
          y: 0,
          scale: Math.min((w - 48) / b.width, (h - 48) / b.height, 1.2),
          fitted: true,
        };
        camera.x = (w - b.width * camera.scale) / 2;
        camera.y = (h - b.height * camera.scale) / 2;
        paint();
      }
      function initialCamera() {
        fit();
        if (camera.scale < 0.7) {
          const anchors = (
            current === "runtime"
              ? ["GameServer", "ClientSlot", "GameSession"]
              : ["DirectoryService", "ListingPublication", "ServerListing"]
          ).map((name) => {
            const n = world.querySelector(`[data-name="${name}"]`),
              m = n.transform.baseVal.consolidate().matrix,
              r = n.querySelector("rect");
            return {
              x: m.e,
              y: m.f,
              w: Number(r.getAttribute("width")),
              h: Number(r.getAttribute("height")),
            };
          });
          const x =
              (Math.min(...anchors.map((n) => n.x)) +
                Math.max(...anchors.map((n) => n.x + n.w))) /
              2,
            y =
              (Math.min(...anchors.map((n) => n.y)) +
                Math.max(...anchors.map((n) => n.y + n.h))) /
              2;
          camera = {
            scale: 0.7,
            x: canvas.clientWidth / 2 - x * 0.7,
            y: canvas.clientHeight / 2 - y * 0.7,
            fitted: false,
          };
          paint();
        }
      }
      function applyZoom(scale, x, y) {
        scale = clampScale(scale);
        const ratio = scale / camera.scale;
        camera.x = x - (x - camera.x) * ratio;
        camera.y = y - (y - camera.y) * ratio;
        camera.scale = scale;
        camera.fitted = false;
        paint();
      }
      function zoomTo(
        scale,
        x = canvas.clientWidth / 2,
        y = canvas.clientHeight / 2,
      ) {
        cancelPinchZoom();
        applyZoom(scale, x, y);
      }
      function animatePinchZoom(time) {
        const zoom = pinchZoom,
          elapsed = Math.max(0, Math.min(time - zoom.time, 64)),
          gap = Math.log(zoom.scale / camera.scale),
          finished = Math.abs(gap) < 0.0001;
        zoom.time = time;
        // Ease in log space so zooming in and out feel equally responsive.
        applyZoom(
          finished
            ? zoom.scale
            : camera.scale *
                Math.exp(gap * (1 - Math.exp(-elapsed / PINCH_EASING_MS))),
          zoom.x,
          zoom.y,
        );
        if (finished) {
          pinchZoom = null;
          pinchFrame = null;
        } else pinchFrame = requestAnimationFrame(animatePinchZoom);
      }
      function pinchZoomBy(delta, x, y) {
        if (!pinchZoom)
          pinchZoom = { scale: camera.scale, x, y, time: performance.now() };
        // Accumulate against the target so frequent touchpad events are retained.
        pinchZoom.scale = clampScale(pinchZoom.scale * Math.exp(delta));
        pinchZoom.x = x;
        pinchZoom.y = y;
        camera.fitted = false;
        if (pinchFrame === null)
          pinchFrame = requestAnimationFrame(animatePinchZoom);
      }
      function pan(dx, dy) {
        cancelPinchZoom();
        camera.x += dx;
        camera.y += dy;
        camera.fitted = false;
        paint();
      }
      function closePanel() {
        panel.classList.remove("open");
        selected = null;
        world
          .querySelectorAll(".selected")
          .forEach((n) => n.classList.remove("selected"));
      }
      function showView(key, save = true) {
        cancelPinchZoom();
        if (save) cameras[current + ":" + fields] = { ...camera };
        current = key;
        const v = view();
        world.innerHTML = fields ? v.svgFields : v.svg;
        document
          .querySelectorAll("[data-view]")
          .forEach((b) =>
            b.setAttribute("aria-selected", String(b.dataset.view === key)),
          );
        exportLink("#puml-download", EXPORTS.plantUML[key], `r5-${key}.puml`);
        updateSVGExport();
        closePanel();
        if (cameras[key + ":" + fields]) {
          camera = { ...cameras[key + ":" + fields] };
          paint();
        } else initialCamera();
      }
      function inspect(name) {
        const c = MODEL.classes.find((c) => c.name === name);
        if (!c) return;
        selected = name;
        world
          .querySelectorAll(".node")
          .forEach((n) =>
            n.classList.toggle("selected", n.dataset.name === name),
          );
        content.innerHTML = `<span class="tag">«${E(c.stereo)}»</span><h1>${E(c.name)}</h1><p>${E(c.description)}</p>${c.attrs.length ? "<h2>Fields</h2>" + c.attrs.map(([a, t, k]) => `<div class="field-row"><span>${E(a)}</span><span>${E(t)}${k ? " [" + E(k) + "]" : ""}</span></div>`).join("") : ""}<h2>Source</h2>${c.evidence
          .map((id) => {
            const s = MODEL.sources.find((s) => s.id === id);
            return `<a class="source" href="${E(s.url)}" target="_blank" rel="noopener">${E(s.title)} ↗</a>`;
          })
          .join(
            "",
          )}<p class="muted">OntoUML classification and multiplicities are interpretations.</p>`;
        panel.classList.add("open");
      }
      function focusConcept(name) {
        const c = MODEL.classes.find((c) => c.name === name);
        if (!c) return;
        cancelPinchZoom();
        if (!view().names.includes(name))
          showView(c.pkg === "backend" ? "backend" : "runtime");
        const n = world.querySelector(`[data-name="${name}"]`),
          m = n.transform.baseVal.consolidate().matrix,
          r = n.querySelector("rect"),
          freeWidth =
            canvas.clientWidth > 620
              ? canvas.clientWidth - 338
              : canvas.clientWidth;
        camera.scale = Math.max(camera.scale, 0.85);
        camera.x =
          freeWidth / 2 -
          (m.e + Number(r.getAttribute("width")) / 2) * camera.scale;
        camera.y =
          canvas.clientHeight / 2 -
          (m.f + Number(r.getAttribute("height")) / 2) * camera.scale;
        camera.fitted = false;
        paint();
        inspect(name);
        $("#suggestions").classList.remove("open");
        $("#search").value = "";
        $("#search").blur();
        $(".search").classList.remove("open");
      }
      function about() {
        closePanel();
        content.innerHTML = `<span class="tag">R5Reloaded · Apex Season 3</span><h1>OntoUML</h1><p>Scroll with two fingers to pan. Pinch to zoom. Drag to pan. Select a concept for fields and source.</p><p><kbd>+</kbd> / <kbd>−</kbd> zoom · <kbd>0</kbd> fit · <kbd>Esc</kbd> close</p><h2>Types</h2>${Object.entries(
          {
            kind: "#edf4ff",
            role: "#fff3da",
            relator: "#f3eaff",
            phase: "#eaf8f0",
            event: "#fff0ed",
            mode: "#eaf7fa",
          },
        )
          .map(
            ([s, c]) =>
              `<div class="legend-row"><span class="swatch" style="background:var(--node-${s})"></span>«${s}»</div>`,
          )
          .join(
            "",
          )}<h2>Evidence</h2><p>Public SDK and scripts were inspected at pinned commits. Native engine bodies remain partly opaque.</p><a class="source" href="https://github.com/Mauler125/r5sdk/tree/${MODEL.repositories[0].commit}" target="_blank" rel="noopener">R5 SDK ↗</a><a class="source" href="https://github.com/Mauler125/r5_flowstate/tree/${MODEL.repositories[1].commit}" target="_blank" rel="noopener">Flowstate scripts ↗</a><a id="notes-download" class="source" href="downloads/r5-model-notes.txt" download>Source notes ↓</a><a id="validation-download" class="source" href="downloads/r5-validation.json" download>Validation report ↓</a><p class="muted">JSON schema and structural checks pass. Full OntoUML semantics and editor import remain untested.</p>`;
        panel.classList.add("open");
        exportLink("#notes-download", EXPORTS.notes, "r5-model-notes.txt");
        exportLink(
          "#validation-download",
          EXPORTS.validation,
          "r5-validation.json",
          "application/json",
        );
      }
      document
        .querySelectorAll("[data-view]")
        .forEach((b) => (b.onclick = () => showView(b.dataset.view)));
      $("#zoom-in").onclick = () => zoomTo(camera.scale * 1.25);
      $("#zoom-out").onclick = () => zoomTo(camera.scale / 1.25);
      $("#zoom-value").onclick = () => zoomTo(1);
      $("#fit").onclick = fit;
      $("#info").onclick = about;
      $("#theme-toggle").onclick = () =>
        setTheme(theme === "dark" ? "light" : "dark");
      $(".panel-close").onclick = closePanel;
      $("#fields").onclick = () => {
        cameras[current + ":" + fields] = { ...camera };
        fields = !fields;
        $("#fields").setAttribute("aria-pressed", String(fields));
        showView(current, false);
      };
      $("#export").onclick = () => {
        const open = $("#export-menu").classList.toggle("open");
        $("#export").setAttribute("aria-expanded", String(open));
      };
      $("#search-toggle").onclick = () => {
        const open = $(".search").classList.toggle("open");
        if (open) $("#search").focus();
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu-wrap")) {
          $("#export-menu").classList.remove("open");
          $("#export").setAttribute("aria-expanded", "false");
        }
        if (!e.target.closest(".search") && e.target.id !== "search-toggle") {
          $("#suggestions").classList.remove("open");
          $(".search").classList.remove("open");
        }
      });
      $("#search").addEventListener("input", () => {
        const q = $("#search").value.trim().toLowerCase();
        const hits = q
          ? MODEL.classes
              .filter((c) => c.name.toLowerCase().includes(q))
              .slice(0, 12)
          : [];
        $("#suggestions").replaceChildren(
          ...hits.map((c) => {
            const b = document.createElement("button");
            b.textContent = c.name;
            b.setAttribute("role", "option");
            b.onclick = () => focusConcept(c.name);
            return b;
          }),
        );
        $("#suggestions").classList.toggle("open", !!hits.length);
      });
      $("#search").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          $("#suggestions button")?.click();
          e.preventDefault();
        }
        if (e.key === "ArrowDown") {
          $("#suggestions button")?.focus();
          e.preventDefault();
        }
        if (e.key === "Escape") {
          $("#suggestions").classList.remove("open");
          $(".search").classList.remove("open");
          $("#search").blur();
        }
      });
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const unit =
              e.deltaMode === 1
                ? 16
                : e.deltaMode === 2
                  ? canvas.clientHeight
                  : 1,
            rect = canvas.getBoundingClientRect();
          if (e.ctrlKey || e.metaKey)
            pinchZoomBy(
              -e.deltaY * unit * PINCH_WHEEL_SENSITIVITY,
              e.clientX - rect.left,
              e.clientY - rect.top,
            );
          else pan(-e.deltaX * unit, -e.deltaY * unit);
        },
        { passive: false },
      );
      function gesture() {
        const p = [...pointers.values()];
        if (p.length < 2) return null;
        return {
          x: (p[0].x + p[1].x) / 2,
          y: (p[0].y + p[1].y) / 2,
          d: Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y),
        };
      }
      canvas.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        cancelPinchZoom();
        const rect = canvas.getBoundingClientRect(),
          p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        pointers.set(e.pointerId, p);
        canvas.setPointerCapture(e.pointerId);
        drag = {
          startX: p.x,
          startY: p.y,
          lastX: p.x,
          lastY: p.y,
          moved: false,
          target: e.target.closest(".node")?.dataset.name,
          gesture: gesture(),
        };
        canvas.classList.add("dragging");
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId) || !drag) return;
        const rect = canvas.getBoundingClientRect(),
          p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        pointers.set(e.pointerId, p);
        const g = gesture();
        if (g && drag.gesture) {
          const old = drag.gesture;
          pan(g.x - old.x, g.y - old.y);
          if (old.d > 0) zoomTo((camera.scale * g.d) / old.d, g.x, g.y);
          drag.moved = true;
          drag.gesture = g;
        } else if (g) drag.gesture = g;
        else {
          if (Math.hypot(p.x - drag.startX, p.y - drag.startY) > 4)
            drag.moved = true;
          if (drag.moved) pan(p.x - drag.lastX, p.y - drag.lastY);
          drag.lastX = p.x;
          drag.lastY = p.y;
        }
      });
      function pointerEnd(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (drag?.moved) suppressClick = true;
        if (!pointers.size) {
          if (drag && !drag.moved && drag.target) inspect(drag.target);
          drag = null;
          canvas.classList.remove("dragging");
          setTimeout(() => (suppressClick = false), 0);
        } else {
          const p = [...pointers.values()][0];
          drag = {
            startX: p.x,
            startY: p.y,
            lastX: p.x,
            lastY: p.y,
            moved: true,
            gesture: gesture(),
          };
        }
      }
      canvas.addEventListener("pointerup", pointerEnd);
      canvas.addEventListener("pointercancel", pointerEnd);
      canvas.addEventListener("click", (e) => {
        if (suppressClick) e.stopPropagation();
      });
      world.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target.closest(".node")) {
          e.preventDefault();
          inspect(e.target.closest(".node").dataset.name);
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input")) return;
        if (e.key === "+" || e.key === "=") {
          zoomTo(camera.scale * 1.25);
          e.preventDefault();
        }
        if (e.key === "-") {
          zoomTo(camera.scale / 1.25);
          e.preventDefault();
        }
        if (e.key === "0") {
          fit();
          e.preventDefault();
        }
        if (e.key === "Escape") {
          closePanel();
          $("#export-menu").classList.remove("open");
          $("#suggestions").classList.remove("open");
        }
      });
      let safariScale = 1;
      canvas.addEventListener(
        "gesturestart",
        (e) => {
          e.preventDefault();
          cancelPinchZoom();
          safariScale = 1;
        },
        { passive: false },
      );
      canvas.addEventListener(
        "gesturechange",
        (e) => {
          e.preventDefault();
          if (!(e.scale > 0)) return;
          const r = canvas.getBoundingClientRect();
          pinchZoomBy(
            Math.log(e.scale / safariScale) * PINCH_GESTURE_SENSITIVITY,
            e.clientX - r.left,
            e.clientY - r.top,
          );
          safariScale = e.scale;
        },
        { passive: false },
      );
      canvas.addEventListener("gestureend", (e) => e.preventDefault(), {
        passive: false,
      });
      let canvasSize = {
        width: canvas.clientWidth,
        height: canvas.clientHeight,
      };
      new ResizeObserver(() => {
        const width = canvas.clientWidth,
          height = canvas.clientHeight;
        if (width !== canvasSize.width || height !== canvasSize.height) {
          if (camera.fitted) fit();
          else
            pan(
              (width - canvasSize.width) / 2,
              (height - canvasSize.height) / 2,
            );
          canvasSize = { width, height };
        }
      }).observe(canvas);
      exportLink(
        "#model-download",
        EXPORTS.schema,
        "r5-ontouml.json",
        "application/json",
      );
      exportLink(
        "#bundle-download",
        Uint8Array.from(atob(EXPORTS.bundle), (c) => c.charCodeAt(0)),
        "r5-models.zip",
        "application/zip",
      );
      setTheme(loadTheme(), false);
      showView("runtime", false);
    </script>
  </body>
</html>
