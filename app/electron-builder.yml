# Packages the desktop app: an unsigned NSIS installer on Windows and an AppImage on Linux.
appId: dev.envsemble.atlas
productName: Atlas
copyright: Copyright © 2026 envsemble
directories:
  output: release
  buildResources: build
files:
  - out/**
  - "!out/**/*.map"
  - package.json
  # Only the diagram package's runtime files (its development pages and tooling are not needed).
  - "!node_modules/@envsemble/atlas-diagrams/{development,downloads,scripts,examples,tests,index.html,vite.config.mjs,tsconfig.contracts.json}"
# No asar archive: diagram preparation runs esbuild (a native binary) over the diagram package's
# own sources, which it cannot read from inside an archive. The integrity fuses below need an
# archive, and only add protection to signed builds; these builds are unsigned (ADR 0001).
asar: false
npmRebuild: false
publish: null
# Prunes the app's node_modules and assembles resources/agent: the atlas command and the plugin,
# which the app copies into the Atlas home (scripts/agent-payload.cjs, main/agent/agentFolder.ts).
afterPack: scripts/after-pack.cjs
electronFuses:
  # On: the atlas command runs on the app's own executable with ELECTRON_RUN_AS_NODE=1, as VS Code's
  # `code` does, so it needs no Node.js on the computer. Like the integrity fuses, turning it off only
  # protects signed builds, and these are unsigned (ADR 0001).
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  # Off in the installer and AppImage. `npm run package` also builds an unpacked copy with it on
  # (release/e2e), which the end-to-end suite drives through Playwright's inspector connection.
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: false
  onlyLoadAppFromAsar: false
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  # Forces the per-user install mode (build/installer.nsh), so all-users cannot be chosen.
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
  artifactName: Atlas-Setup-${version}.${ext}
  shortcutName: Atlas
linux:
  target:
    - target: AppImage
      arch: [x64]
  executableName: atlas-desktop
  icon: build/icon.png
  category: Development
  synopsis: Plans, models and shared understanding
  artifactName: Atlas-${version}-${arch}.${ext}
appImage:
  # electron-builder's default desktop entry starts AppImages with --no-sandbox; Atlas keeps the
  # sandbox and refuses to start without it (see the app README, "Linux sandbox").
  executableArgs: []
